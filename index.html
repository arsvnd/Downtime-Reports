<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Major Downtime Report</title>
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f1f5f9;
            --card: #ffffff;
            --text: #0f172a;
            --border: #cbd5e1;
            --success: #059669;
            --danger: #dc2626;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            padding: 15px;
            margin: 0;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }

        h1 { text-align: center; color: var(--primary); margin: 0 0 25px 0; font-size: 1.8rem; }
        h3 { border-left: 4px solid var(--primary); padding-left: 10px; margin: 25px 0 15px 0; font-size: 1.1rem; }

        /* Dashboard Styles */
        .report-card {
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.1s;
        }
        .report-info { flex-grow: 1; }
        .report-title { font-weight: bold; color: var(--primary); display: block; margin-bottom: 4px; }
        .report-meta { font-size: 0.85rem; color: #64748b; }
        .status-badge { 
            font-size: 0.75rem; 
            padding: 2px 8px; 
            border-radius: 12px; 
            font-weight: bold; 
            margin-left: 8px;
        }
        .status-resolved { background: #dcfce7; color: #166534; }
        .status-open { background: #fee2e2; color: #991b1b; }

        .btn-actions { display: flex; gap: 8px; }
        .btn-edit { background: #6366f1; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; }
        .btn-delete { background: var(--danger); color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; }

        .btn-main {
            display: block;
            width: 100%;
            background: var(--primary);
            color: white;
            padding: 16px;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 20px;
        }
        .btn-back { background: #64748b; margin-bottom: 20px; width: auto; padding: 10px 20px; }

        /* Form Styles (Your Original) */
        .form-group { margin-bottom: 18px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.9rem; color: #475569; }
        .block-options { display: grid; grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); gap: 8px; }
        .block-options label {
            border: 1px solid var(--border);
            padding: 12px 5px;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            background: white;
            transition: all 0.2s;
            font-weight: 500;
            margin: 0;
        }
        .block-options input[type="radio"] { display: none; }
        .block-options label:has(input:checked) {
            border-color: var(--primary);
            background-color: #eff6ff;
            color: var(--primary);
            box-shadow: inset 0 0 0 1px var(--primary);
        }
        input[type="text"], input[type="date"], input[type="time"], select, textarea {
            width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 1rem; box-sizing: border-box; background: #fcfcfc;
        }
        textarea { min-height: 90px; resize: vertical; }
        .hidden { display: none; }
        .btn-submit { width: 100%; background: var(--primary); color: white; padding: 16px; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; margin-top: 20px; }
        .btn-copy { background: var(--success); color: white; padding: 10px 20px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; margin-bottom: 10px; }
        #summaryContainer { margin-top: 30px; display: none; }
        #summaryOutput { background: #f8fafc; padding: 20px; border-radius: 8px; white-space: pre-wrap; font-family: 'Courier New', Courier, monospace; border: 1px solid var(--border); font-size: 0.95rem; line-height: 1.4; }
    </style>
</head>
<body>

<div class="container">
    <h1>LNS Major Downtime Report</h1>

    <div id="dashboardView">
        <button class="btn-main" onclick="createNewReport()">+ Create New Report</button>
        <div id="reportsList"></div>
    </div>

    <div id="formView" class="hidden">
        <button class="btn-main btn-back" onclick="showDashboard()">← Back to Dashboard</button>
        <input type="hidden" id="editingId">
        
        <form id="downtimeForm">
            <div class="form-group">
                <label>1. Stop Type:</label>
                <div class="block-options">
                    <label><input type="radio" name="stopType" value="BM" required> BM</label>
                    <label><input type="radio" name="stopType" value="PD"> PD</label>
                    <label><input type="radio" name="stopType" value="Other" id="otherToggle"> Other</label>
                </div>
                <input type="text" id="otherStopType" class="hidden" placeholder="Specify other stop type..." style="margin-top:10px;">
            </div>

            <div class="form-group">
                <label>2. Equipment</label>
                <div class="block-options" id="equipmentGroup">
                    <label><input type="radio" name="equipment" value="1-1" required onchange="filterMachines()"> 1-1</label>
                    <label><input type="radio" name="equipment" value="1-2" onchange="filterMachines()"> 1-2</label>
                    <label><input type="radio" name="equipment" value="1-3" onchange="filterMachines()"> 1-3</label>
                    <label><input type="radio" name="equipment" value="1-4" onchange="filterMachines()"> 1-4</label>
                    <label><input type="radio" name="equipment" value="1-5" onchange="filterMachines()"> 1-5</label>
                    <label><input type="radio" name="equipment" value="1-H" onchange="filterMachines()"> 1-H</label>
                    <label><input type="radio" name="equipment" value="2-1" onchange="filterMachines()"> 2-1</label>
                    <label><input type="radio" name="equipment" value="2-5" onchange="filterMachines()"> 2-5</label>
                    <label><input type="radio" name="equipment" value="3-1" onchange="filterMachines()"> 3-1</label>
                </div>
            </div>

            <label>3. Machine Area</label>
            <div class="form-group">
                <label>Machine:</label>
                <select id="machine" required onchange="updateUnits()">
                    <option value="" disabled selected>Select Machine</option>
                    <option value="ESP">ESP</option>
                    <option value="Lamination">LAMI</option>
                    <option value="D-STK">D-STK</option>
                    <option value="HalfCell/Taping">HC/TAPING</option>
                    <option value="Inspection">INSP</option>
                    <option value="Unloader">UNL</option>
                </select>
            </div>

            <div class="form-group">
                <label>Unit:</label>
                <select id="unit">
                    <option value="-">-</option>
                </select>
            </div>

            <div class="form-group">
                <label>Assembly:</label>
                <input type="text" id="assembly" placeholder="e.g. Center/Upper Electrode Cutter">
            </div>

            <div class="form-group">
                <label>Date:</label>
                <input type="date" id="dateInput">
            </div>

            <div class="form-group">
                <label>Start Time:</label>
                <input type="time" id="startTime">
            </div>

            <div class="form-group">
                <label>Issue Resolved?</label>
                <div class="block-options">
                    <label><input type="radio" name="resolved" value="Yes" id="resYes"> Yes</label>
                    <label><input type="radio" name="resolved" value="No" checked> No</label>
                </div>
            </div>

            <div class="form-group hidden" id="endTimeContainer">
                <label>End Time:</label>
                <input type="time" id="endTime">
            </div>

            <h3>Details</h3>
            <div class="form-group">
                <label>5. Phenomenon:</label>
                <textarea id="phenomenon" placeholder="Describe what happened..."></textarea>
            </div>
            <div class="form-group">
                <label>6. Root Cause:</label>
                <textarea id="rootCause" placeholder="What caused the issue?"></textarea>
            </div>
            <div class="form-group">
                <label>7. Action Taken:</label>
                <textarea id="actionTaken" placeholder="How was the issue fixed?"></textarea>
            </div>

            <button type="button" class="btn-submit" onclick="generateSummary()">Generate Summary</button>
            <div id="errorMessage" style="color: var(--danger); font-weight: 600; margin-top: 10px; text-align: center; display: none;"></div>
        </form>

        <div id="summaryContainer">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <label>Generated Summary:</label>
                <button class="btn-copy" onclick="copyToClipboard()">Copy Summary</button>
            </div>
            <div id="summaryOutput"></div>
        </div>
    </div>
</div>

<script>
    let reports = JSON.parse(localStorage.getItem('lns_storage_v1') || '[]');

    // --- DASHBOARD LOGIC ---
    function renderDashboard() {
        const list = document.getElementById('reportsList');
        list.innerHTML = reports.length === 0 ? '<p style="text-align:center; color:#64748b;">No reports saved yet.</p>' : '';
        
        reports.forEach(report => {
            const card = document.createElement('div');
            card.className = 'report-card';
            const statusClass = report.resolved === 'Yes' ? 'status-resolved' : 'status-open';
            const statusText = report.resolved === 'Yes' ? 'Resolved' : 'Open';
            
            card.innerHTML = `
                <div class="report-info">
                    <span class="report-title">${report.equipment || 'N/A'} | ${report.phenomenon.substring(0, 35)}${report.phenomenon.length > 35 ? '...' : ''}</span>
                    <span class="report-meta">${formatDate(report.dateRaw)} • ${formatTime(report.startRaw)} <span class="status-badge ${statusClass}">${statusText}</span></span>
                </div>
                <div class="btn-actions">
                    <button class="btn-edit" onclick="editReport(${report.id})">Edit</button>
                    <button class="btn-delete" onclick="deleteReport(${report.id})">Delete</button>
                </div>
            `;
            list.appendChild(card);
        });
    }

    function createNewReport() {
        document.getElementById('editingId').value = '';
        document.getElementById('downtimeForm').reset();
        
        // Reset dynamic fields
        const now = new Date();
        document.getElementById('dateInput').value = now.toISOString().split('T')[0];
        document.getElementById('startTime').value = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');
        document.getElementById('endTimeContainer').classList.add('hidden');
        document.getElementById('otherStopType').classList.add('hidden');
        document.getElementById('summaryContainer').style.display = 'none';
        
        showForm();
    }

    function showForm() {
        document.getElementById('dashboardView').classList.add('hidden');
        document.getElementById('formView').classList.remove('hidden');
    }

    function showDashboard() {
        document.getElementById('dashboardView').classList.remove('hidden');
        document.getElementById('formView').classList.add('hidden');
        renderDashboard();
    }

    function deleteReport(id) {
        if (confirm('Are you sure you want to delete this report?')) {
            reports = reports.filter(r => r.id !== id);
            localStorage.setItem('lns_storage_v1', JSON.stringify(reports));
            renderDashboard();
        }
    }

    function editReport(id) {
        const report = reports.find(r => r.id === id);
        if (!report) return;

        document.getElementById('editingId').value = id;
        
        // Populate inputs
        if (report.stopTypeVal) {
            const radio = document.querySelector(`input[name="stopType"][value="${report.stopTypeVal}"]`);
            if (radio) radio.checked = true;
            document.getElementById('otherStopType').classList.toggle('hidden', report.stopTypeVal !== 'Other');
            document.getElementById('otherStopType').value = report.otherStopType || '';
        }

        if (report.equipment) {
            const eqRadio = document.querySelector(`input[name="equipment"][value="${report.equipment}"]`);
            if (eqRadio) eqRadio.checked = true;
        }

        document.getElementById('machine').value = report.machine;
        updateUnits();
        document.getElementById('unit').value = report.unit;
        document.getElementById('assembly').value = report.assembly;
        document.getElementById('dateInput').value = report.dateRaw;
        document.getElementById('startTime').value = report.startRaw;
        
        const resRadio = document.querySelector(`input[name="resolved"][value="${report.resolved}"]`);
        if (resRadio) {
            resRadio.checked = true;
            document.getElementById('endTimeContainer').classList.toggle('hidden', report.resolved !== 'Yes');
        }
        document.getElementById('endTime').value = report.endRaw;
        document.getElementById('phenomenon').value = report.phenomenon;
        document.getElementById('rootCause').value = report.rootCause;
        document.getElementById('actionTaken').value = report.actionTaken;

        document.getElementById('summaryContainer').style.display = 'none';
        showForm();
    }

    // --- YOUR ORIGINAL LOGIC (Preserved) ---
    function filterMachines() {
        const equipment = document.querySelector('input[name="equipment"]:checked')?.value;
        const machineSelect = document.getElementById('machine');
        const options = machineSelect.options;
        for (let i = 1; i < options.length; i++) {
            const val = options[i].value;
            if (equipment === '1-H') {
                options[i].style.display = (val === 'ESP' || val === 'Lamination' || val === 'Unloader') ? 'block' : 'none';
            } else {
                options[i].style.display = 'block';
            }
        }
        if (machineSelect.selectedOptions[0].style.display === 'none') {
            machineSelect.selectedIndex = 0;
            updateUnits();
        }
    }

    function updateUnits() {
        const process = document.getElementById('machine').value;
        const unitSelect = document.getElementById('unit');
        let options = ['-'];
        if (process === 'ESP') options = [' ', 'Cathode Unwinder', 'Anode Unwinder', 'ATR', 'Crane'];
        else if (process === 'Lamination') options = [' ', 'Separator/PET Unwinder', 'Electrode/Separator Combiner', 'Heating/Laminator', 'Cell Final Cutter', 'Cell Tracking System', 'Cell Inspector', 'Cell Unloader'];
        else if (process === 'D-STK') options = [' ', 'Cell Loading C/V[1]', 'Cell Loading C/V[2]', 'Stacking Table[01]', 'Stacking Table[02]', 'Stacking Table[03]', 'Stacked Cell Transfer'];
        else if (process === 'HalfCell/Taping') options = [' ', 'Half Cell Loading', 'HalfCell Stack', 'LMS', 'Taping[01]', 'Taping[02]'];
        else if (process === 'Inspection') options = [' ', 'Taped Cell Vision', 'Taped Cell Rotate', 'Taped Cell ', 'Cell Tracking System', 'Taped Cell Transfer'];
        else if (process === 'Unloader') options = [' ', 'Taped Cell Unloader'];

        unitSelect.innerHTML = '';
        options.forEach(opt => {
            const el = document.createElement('option');
            el.textContent = opt; el.value = opt; unitSelect.appendChild(el);
        });
    }

    function formatDate(dateStr) {
        if (!dateStr) return "";
        const date = new Date(dateStr + 'T12:00:00'); 
        return `${date.getDate()} ${date.toLocaleString('default', { month: 'long' })} ${date.getFullYear()}`;
    }

    function formatTime(timeStr) {
        if (!timeStr) return "";
        let [hours, minutes] = timeStr.split(':');
        let ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12 || 12;
        return `${hours.toString().padStart(2, '0')}:${minutes} ${ampm}`;
    }

    // --- MODIFIED GENERATE SUMMARY (Now saves automatically) ---
    function generateSummary() {
        const phenomenon = document.getElementById('phenomenon').value.trim();
        const rootCause = document.getElementById('rootCause').value.trim();
        const actionTaken = document.getElementById('actionTaken').value.trim();
        const errorEl = document.getElementById('errorMessage');

        if (!phenomenon) { errorEl.innerText = "Please enter Phenomenon"; errorEl.style.display = 'block'; return; }
        if (!rootCause) { errorEl.innerText = "Please enter Root Cause"; errorEl.style.display = 'block'; return; }
        if (!actionTaken) { errorEl.innerText = "Please enter Action Taken"; errorEl.style.display = 'block'; return; }
        errorEl.style.display = 'none';

        const stopTypeVal = document.querySelector('input[name="stopType"]:checked')?.value;
        const resolved = document.querySelector('input[name="resolved"]:checked').value;
        const startRaw = document.getElementById('startTime').value;
        const endRaw = document.getElementById('endTime').value;

        // Save Data
        const reportData = {
            id: document.getElementById('editingId').value ? parseInt(document.getElementById('editingId').value) : Date.now(),
            stopTypeVal: stopTypeVal,
            otherStopType: document.getElementById('otherStopType').value,
            stopType: stopTypeVal === 'Other' ? document.getElementById('otherStopType').value : stopTypeVal,
            equipment: document.querySelector('input[name="equipment"]:checked')?.value || "",
            machine: document.getElementById('machine').value,
            unit: document.getElementById('unit').value,
            assembly: document.getElementById('assembly').value,
            dateRaw: document.getElementById('dateInput').value,
            startRaw: startRaw,
            endRaw: endRaw,
            resolved: resolved,
            phenomenon: phenomenon,
            rootCause: rootCause,
            actionTaken: actionTaken
        };

        const index = reports.findIndex(r => r.id === reportData.id);
        if (index > -1) reports[index] = reportData;
        else reports.push(reportData);
        localStorage.setItem('lns_storage_v1', JSON.stringify(reports));

        // Downtime Calculation
        let downtimeLine = "";
        if (resolved === 'Yes' && startRaw && endRaw) {
            const start = new Date(`2000-01-01T${startRaw}`);
            let end = new Date(`2000-01-01T${endRaw}`);
            if (end < start) end.setDate(end.getDate() + 1);
            const diff = Math.floor((end - start) / 60000);
            downtimeLine = `\n\nTotal Downtime: ${Math.floor(diff/60)}h ${diff%60}m`;
        }

        const summary = `1. Stop Type:
${reportData.stopType}

2. Equipment:
${reportData.equipment}

3. Machine Area:
    Machine: ${reportData.machine}
    Unit: ${reportData.unit}
    Assembly: ${reportData.assembly}
    Date: ${formatDate(reportData.dateRaw)}
    Start Time: ${formatTime(reportData.startRaw)}
    End Time: ${resolved === 'Yes' ? formatTime(endRaw) : "-"}
    Issue Resolved: ${resolved === 'Yes' ? "Yes ✅" : "No"}

5. Phenomenon:
${phenomenon}

6. Root Cause:
${rootCause}

7. Action taken:
${actionTaken}${downtimeLine}`;

        document.getElementById('summaryOutput').innerText = summary;
        document.getElementById('summaryContainer').style.display = 'block';
        document.getElementById('summaryContainer').scrollIntoView({ behavior: 'smooth' });
    }

    function copyToClipboard() {
        const text = document.getElementById('summaryOutput').innerText;
        navigator.clipboard.writeText(text).then(() => {
            const btn = document.querySelector('.btn-copy');
            btn.innerText = "✓ Copied!";
            setTimeout(() => { btn.innerText = "Copy Summary"; }, 2000);
        });
    }

    // --- EVENT LISTENERS ---
    document.getElementsByName('stopType').forEach(el => {
        el.addEventListener('change', () => {
            document.getElementById('otherStopType').classList.toggle('hidden', el.value !== 'Other');
        });
    });

    document.getElementsByName('resolved').forEach(el => {
        el.addEventListener('change', () => {
            document.getElementById('endTimeContainer').classList.toggle('hidden', el.value !== 'Yes');
        });
    });

    // Init
    renderDashboard();
</script>

</body>
</html>
