<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="manifest" href="manifest-admin.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Dashboard - Shift Logs</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; }

        :root {
            /* Warm Glassmorphism Palette */
            --shell-bg: radial-gradient(circle at top left, #f6f1e8, #e0d7c6);
            --card: rgba(255, 255, 255, 0.45);
            --card-2: rgba(255, 255, 255, 0.7);
            --card-border: rgba(255, 255, 255, 0.6);
            --card-border-strong: #ffffff;
            
            /* Brand Accents based on the reference image */
            --yellow: #E5FA5E; 
            --orange: #FF9A62; 
            --dark: #2C2C2C;   
            
            --text-main: #1a1a1a;
            --text-muted: #5c5c5c;
            --text-subtle: #8e8e8e;
            
            --danger: #FF4B4B;
            --success: #10b981;

            /* Large rounded corners */
            --r-sm: 16px;
            --r: 28px;
            --r-lg: 36px;
            
            --shadow-sm: 0 4px 12px rgba(0,0,0,0.03);
            --shadow: 0 12px 40px rgba(0,0,0,0.06);
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--shell-bg);
            background-attachment: fixed;
            color: var(--text-main);
            margin: 0;
            padding: 32px 24px 64px;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .container { max-width: 1160px; margin: 0 auto; }
        .hidden { display: none !important; }

        /* ── HEADER ── */
        .header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 32px; flex-wrap: wrap; }
        .header-left h1 { margin: 0 0 8px; font-size: 36px; font-weight: 300; letter-spacing: -1px; color: var(--text-main); display: flex; align-items: center; gap: 14px; }
        
        .header-left h1 .logo-icon {
            width: 44px; height: 44px; background: var(--dark); color: #fff; border-radius: 14px;
            display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0;
            box-shadow: 0 8px 24px rgba(44,44,44,0.25); cursor: pointer; user-select: none; transition: transform 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .header-left h1 .logo-icon:active { transform: scale(0.9); }

        .header-badge { display: inline-flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.6); backdrop-filter: blur(10px); border: 1px solid var(--card-border-strong); padding: 6px 14px; border-radius: 100px; font-size: 13px; font-weight: 500; color: var(--text-muted); box-shadow: var(--shadow-sm); }
        .header-badge::before { content: ''; width: 8px; height: 8px; background: var(--orange); border-radius: 50%; box-shadow: 0 0 8px var(--orange); animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        .header-actions { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 6px; }

        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 14px 24px; border: none; border-radius: 100px; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1); white-space: nowrap; font-family: inherit; }
        .btn-outline { background: rgba(255,255,255,0.6); backdrop-filter: blur(10px); color: var(--text-main); border: 1px solid var(--card-border-strong); box-shadow: var(--shadow-sm); }
        .btn-outline:hover { background: #fff; transform: translateY(-2px); box-shadow: var(--shadow); }
        .btn-outline:active { transform: scale(0.96); }
        
        .btn-accent { background: var(--dark); color: #fff; box-shadow: 0 8px 24px rgba(44,44,44,0.3); }
        .btn-accent:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(44,44,44,0.4); }
        .btn-accent:active { transform: scale(0.96); }

        /* ── CONTROLS ── */
        .controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
        .tabs { display: flex; gap: 6px; background: rgba(255,255,255,0.5); backdrop-filter: blur(16px); border: 1px solid var(--card-border-strong); padding: 6px; border-radius: 100px; box-shadow: var(--shadow-sm); }
        .tab-btn { padding: 10px 28px; border: none; border-radius: 100px; background: transparent; font-size: 14px; font-weight: 600; color: var(--text-muted); cursor: pointer; transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1); font-family: inherit; }
        .tab-btn.active { background: #fff; color: var(--text-main); box-shadow: 0 4px 16px rgba(0,0,0,0.06); }
        .tab-btn:not(.active):hover { color: var(--text-main); background: rgba(255,255,255,0.4); }

        /* ── METRICS GRID ── */
        .metrics-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
        .metric-card { padding: 24px 20px; border-radius: var(--r); position: relative; overflow: hidden; transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1), box-shadow 0.3s; border: none; }
        .metric-card:hover { transform: translateY(-4px); }
        .metric-card .mc-label { font-size: 13px; font-weight: 600; margin-bottom: 12px; opacity: 0.9; }
        .metric-card .mc-val-row { display: flex; align-items: baseline; gap: 8px; }
        .metric-card .mc-val { font-size: 42px; font-weight: 300; letter-spacing: -1px; line-height: 1; font-family: inherit; }
        .metric-card .mc-sub { font-size: 14px; font-weight: 500; font-family: var(--mono); opacity: 0.8; }

        /* Colored Cards matching the reference image */
        .mc-bm { background: var(--orange); color: #000; box-shadow: 0 12px 32px rgba(255,154,98,0.25); }
        .mc-pm { background: var(--yellow); color: #000; box-shadow: 0 12px 32px rgba(229,250,94,0.2); }
        .mc-pd { background: var(--dark); color: #fff; box-shadow: 0 12px 32px rgba(44,44,44,0.25); }
        .mc-total { background: rgba(255,255,255,0.6); backdrop-filter: blur(16px); border: 1px solid var(--card-border-strong); color: var(--text-main); box-shadow: var(--shadow-sm); }
        .mc-total .mc-label { color: var(--text-muted); }

        /* ── TABLE ── */
        .table-wrap { background: var(--card); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-radius: var(--r); box-shadow: var(--shadow); border: 1px solid var(--card-border-strong); overflow: hidden; }
        .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        table { width: 100%; border-collapse: collapse; text-align: left; min-width: 600px; }
        thead th { background: rgba(255,255,255,0.4); padding: 18px 24px; font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid rgba(255,255,255,0.6); white-space: nowrap; }
        tbody td { padding: 16px 24px; border-bottom: 1px solid rgba(0,0,0,0.03); font-size: 15px; vertical-align: middle; color: var(--text-main); transition: background 0.2s; }
        tbody tr:hover td { background: rgba(255,255,255,0.3); }
        tbody tr:last-child td { border-bottom: none; }
        
        .section-row td { background: rgba(255,255,255,0.7) !important; font-weight: 600; font-size: 14px; padding-top: 16px; padding-bottom: 16px; border-bottom: 1px solid rgba(0,0,0,0.05); }
        .section-row td:first-child { display: flex; align-items: center; gap: 10px; }
        .section-row td:first-child::before { content: ''; width: 6px; height: 6px; background: var(--dark); border-radius: 50%; }
        .line-cell { font-weight: 500; padding-left: 48px !important; color: var(--text-muted); }

        /* Stat pills */
        .stat-pill { display: inline-flex; align-items: center; justify-content: space-between; gap: 12px; padding: 6px 14px; border-radius: 100px; font-size: 13px; font-weight: 600; min-width: 90px; }
        .stat-bm  { background: rgba(255,154,98,0.2); color: #b3581c; }
        .stat-pm  { background: rgba(229,250,94,0.3); color: #6b781a; }
        .stat-pd  { background: rgba(44,44,44,0.1); color: var(--text-main); }
        .stat-total { background: #fff; color: var(--text-main); box-shadow: 0 2px 8px rgba(0,0,0,0.04); }

        .loading { text-align: center; padding: 100px 24px; color: var(--text-muted); font-size: 16px; font-weight: 500; }
        .spinner { display: inline-block; width: 32px; height: 32px; border: 3px solid rgba(0,0,0,0.1); border-top-color: var(--dark); border-radius: 50%; animation: spin 0.8s cubic-bezier(0.5, 0, 0.5, 1) infinite; margin-bottom: 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── ADVANCED MODE (SECRET DASHBOARD) ── */
        .adv-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid rgba(0,0,0,0.05); }
        .adv-header h2 { margin: 0; color: var(--text-main); font-size: 24px; font-weight: 300; letter-spacing: -0.5px; display: flex; align-items: center; gap: 10px; }
        .adv-header h2::before { content: '⚡'; font-size: 20px; background: #fff; padding: 8px; border-radius: 12px; box-shadow: var(--shadow-sm); }
        
        .adv-charts { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; margin-bottom: 24px; }
        .chart-card { background: var(--card); backdrop-filter: blur(16px); padding: 24px; border-radius: var(--r); border: 1px solid var(--card-border-strong); box-shadow: var(--shadow); }
        .chart-card h3 { margin: 0 0 20px 0; font-size: 14px; font-weight: 600; color: var(--text-main); text-transform: uppercase; letter-spacing: 0.5px; opacity: 0.8; }
        
        .raw-table-wrap { max-height: 500px; overflow-y: auto; }
        .raw-table-wrap th { position: sticky; top: 0; z-index: 10; background: rgba(255,255,255,0.85); backdrop-filter: blur(10px); box-shadow: 0 2px 8px rgba(0,0,0,0.03); }
        
        .badge-mini { padding: 4px 10px; border-radius: 100px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .bg-bm { background: var(--orange); color: #000; }
        .bg-pm { background: var(--yellow); color: #000; }
        .bg-pd { background: var(--dark); color: #fff; }

        /* Animation class for JS rendering */
        .fade-in { animation: fadeIn 0.4s cubic-bezier(0.25, 0.8, 0.25, 1) forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 900px) {
            .metrics-grid { grid-template-columns: repeat(2, 1fr); }
            .adv-charts { grid-template-columns: 1fr; }
        }
        @media (max-width: 640px) {
            body { padding: 20px 16px 48px; }
            .header { margin-bottom: 24px; }
            .header-left h1 { font-size: 28px; }
            .header-left h1 .logo-icon { width: 36px; height: 36px; font-size: 16px; border-radius: 10px; }
            .btn { padding: 12px 18px; font-size: 14px; }
            .btn span.btn-label { display: none; }
            .metrics-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
            .metric-card { padding: 18px 16px; border-radius: 20px; }
            .metric-card .mc-val { font-size: 32px; }
            .tabs { width: 100%; }
            .tab-btn { flex: 1; padding: 10px; font-size: 13px; text-align: center; }
        }
    </style>
</head>
<body>

<div class="container">

    <div class="header">
        <div class="header-left">
            <h1>
                <div class="logo-icon" onclick="handleSecretClick()" title="Secret Admin Toggle">◨</div>
                Shift Logs Admin
            </h1>
            <div style="margin-top: 10px;">
                <span class="header-badge" id="lastUpdated">Connecting…</span>
            </div>
        </div>
        <div class="header-actions">
            <button class="btn btn-outline" onclick="fetchData()">
                ↻ <span class="btn-label">Refresh</span>
            </button>
            <button class="btn btn-accent" onclick="exportExcel()">
                ↓ <span class="btn-label">Export Excel</span>
            </button>
        </div>
    </div>

    <div id="standardView">
        <div class="controls">
            <div class="tabs">
                <button class="tab-btn active" id="tab-Assembly" onclick="setTab('Assembly')">Assembly</button>
                <button class="tab-btn" id="tab-Formation" onclick="setTab('Formation')">Formation</button>
            </div>
        </div>

        <div id="dashboardContent">
            <div class="loading">
                <div class="spinner"></div><br>
                Fetching live shift data…
            </div>
        </div>
    </div>

    <div id="advancedView" class="hidden">
        <div class="adv-header fade-in">
            <h2>Advanced Analytics & Master Logs</h2>
            <button class="btn btn-outline" onclick="toggleAdvancedMode()">
                ✕ <span class="btn-label">Exit Mode</span>
            </button>
        </div>

        <div class="adv-charts fade-in">
            <div class="chart-card">
                <h3>Global Task Distribution</h3>
                <canvas id="typeChart" style="max-height: 250px;"></canvas>
            </div>
            <div class="chart-card">
                <h3>Hours Logged By Technician</h3>
                <canvas id="techChart" style="max-height: 250px;"></canvas>
            </div>
        </div>

        <div class="table-wrap raw-table-wrap fade-in">
            <div class="table-scroll">
                <table id="rawTable">
                    <thead>
                        <tr>
                            <th>Time Logged</th>
                            <th>Technician</th>
                            <th>Dept</th>
                            <th>Section</th>
                            <th>Line</th>
                            <th>Type</th>
                            <th>Description</th>
                            <th>Time Span</th>
                            <th>Duration</th>
                        </tr>
                    </thead>
                    <tbody id="rawTableBody">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

</div>

<script>
    // --- CONFIGURATION ---
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxl0KDjJSHmd_FKei_H-qaFCLMnd1SLdsdFfFf9F0rTMSezS2vz_kEgdJ7ECAmXtr0APQ/exec";

    let rawTasks = [];
    let aggregatedData = {};
    let currentTab = 'Assembly';
    let refreshInterval = null;
    let isAdvancedMode = false;
    
    // Chart instances
    let typeChartInstance = null;
    let techChartInstance = null;

    document.addEventListener("DOMContentLoaded", () => {
        fetchData();
        refreshInterval = setInterval(fetchData, 60000);
    });

    // --- SECRET BUTTON LOGIC ---
    let secretClicks = 0;
    let secretTimer;
    function handleSecretClick() {
        secretClicks++;
        clearTimeout(secretTimer);
        secretTimer = setTimeout(() => secretClicks = 0, 800); // 800ms window
        
        if (secretClicks >= 3) { // 3 rapid clicks to toggle
            toggleAdvancedMode();
            secretClicks = 0;
        }
    }

    function toggleAdvancedMode() {
        isAdvancedMode = !isAdvancedMode;
        if (isAdvancedMode) {
            document.getElementById('standardView').classList.add('hidden');
            document.getElementById('advancedView').classList.remove('hidden');
            renderAdvancedView();
        } else {
            document.getElementById('advancedView').classList.add('hidden');
            document.getElementById('standardView').classList.remove('hidden');
        }
    }

    function setTab(dept) {
        currentTab = dept;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(`tab-${dept}`).classList.add('active');
        renderDashboard();
    }

    function fetchData() {
        const content = document.getElementById('dashboardContent').innerHTML;
        if (content.includes("Error") || content.includes("Fetching")) {
            document.getElementById('dashboardContent').innerHTML =
                '<div class="loading"><div class="spinner"></div><br>Fetching live shift data…</div>';
        }

        fetch(`${WEB_APP_URL}?action=getShiftMetrics`)
        .then(res => res.json())
        .then(data => {
            rawTasks = data.tasks;
            const now = new Date();
            document.getElementById('lastUpdated').innerHTML =
                `Live &nbsp;·&nbsp; ${now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;
            
            processData();
            renderDashboard();
            
            if (isAdvancedMode) {
                renderAdvancedView(); // Auto-update graphs if open
            }
        })
        .catch(err => {
            console.error("Refresh failed:", err);
            if (rawTasks.length === 0) {
                document.getElementById('dashboardContent').innerHTML =
                    `<div class="loading" style="color:var(--danger);">⚠️ Could not load data. Check your connection or Web App URL.</div>`;
            }
        });
    }

    function processData() {
        aggregatedData = {
            "Assembly":  { sections: {}, totals: { BM:{c:0,h:0}, PM:{c:0,h:0}, PD:{c:0,h:0}, ALL:{c:0,h:0} } },
            "Formation": { sections: {}, totals: { BM:{c:0,h:0}, PM:{c:0,h:0}, PD:{c:0,h:0}, ALL:{c:0,h:0} } }
        };

        rawTasks.forEach(t => {
            let dept = t.dept;
            if (!aggregatedData[dept]) return;

            let sec  = t.section  || "General";
            let type = t.type     || "BM";
            let dur  = parseFloat(t.duration) || 0;

            let line = t.line || "N/A";
            if (typeof line === 'string' && line.includes('T') && line.includes('Z')) {
                let d = new Date(line);
                if (!isNaN(d.getTime())) line = (d.getMonth() + 1) + "-" + d.getDate();
                t.line = line; // Fix raw array too for advanced mode
            }

            aggregatedData[dept].totals[type].c++;
            aggregatedData[dept].totals[type].h += dur;
            aggregatedData[dept].totals.ALL.c++;
            aggregatedData[dept].totals.ALL.h += dur;

            if (!aggregatedData[dept].sections[sec]) {
                aggregatedData[dept].sections[sec] = { totals: { BM:{c:0,h:0}, PM:{c:0,h:0}, PD:{c:0,h:0}, ALL:{c:0,h:0} }, lines: {} };
            }
            if (!aggregatedData[dept].sections[sec].lines[line]) {
                aggregatedData[dept].sections[sec].lines[line] = { BM:{c:0,h:0}, PM:{c:0,h:0}, PD:{c:0,h:0}, ALL:{c:0,h:0} };
            }

            aggregatedData[dept].sections[sec].totals[type].c++;
            aggregatedData[dept].sections[sec].totals[type].h += dur;
            aggregatedData[dept].sections[sec].totals.ALL.c++;
            aggregatedData[dept].sections[sec].totals.ALL.h += dur;

            aggregatedData[dept].sections[sec].lines[line][type].c++;
            aggregatedData[dept].sections[sec].lines[line][type].h += dur;
            aggregatedData[dept].sections[sec].lines[line].ALL.c++;
            aggregatedData[dept].sections[sec].lines[line].ALL.h += dur;
        });
    }

    function renderDashboard() {
        const deptData = aggregatedData[currentTab];
        if (!deptData) return;
        const t = deptData.totals;

        let html = `
        <div class="fade-in">
            <div class="metrics-grid">
                <div class="metric-card mc-bm">
                    <div class="mc-label">Breakdowns (BM)</div>
                    <div class="mc-val-row"><span class="mc-val">${t.BM.c}</span><span class="mc-sub">${t.BM.h.toFixed(1)} hrs</span></div>
                </div>
                <div class="metric-card mc-pm">
                    <div class="mc-label">Preventive (PM)</div>
                    <div class="mc-val-row"><span class="mc-val">${t.PM.c}</span><span class="mc-sub">${t.PM.h.toFixed(1)} hrs</span></div>
                </div>
                <div class="metric-card mc-pd">
                    <div class="mc-label">Process (PD)</div>
                    <div class="mc-val-row"><span class="mc-val">${t.PD.c}</span><span class="mc-sub">${t.PD.h.toFixed(1)} hrs</span></div>
                </div>
                <div class="metric-card mc-total">
                    <div class="mc-label">Total Work</div>
                    <div class="mc-val-row"><span class="mc-val">${t.ALL.c}</span><span class="mc-sub">${t.ALL.h.toFixed(1)} hrs</span></div>
                </div>
            </div>
            <div class="table-wrap"><div class="table-scroll"><table>
                <thead><tr><th>Location / Line</th><th>Breakdown</th><th>Preventive</th><th>Process</th><th>Total Time</th></tr></thead><tbody>`;

        const sections = Object.keys(deptData.sections).sort();
        if (sections.length === 0) {
            html += `<tr><td colspan="5" style="text-align:center;padding:64px;color:var(--text-muted);">No tasks logged for ${currentTab} yet this shift.</td></tr>`;
        }

        sections.forEach(sec => {
            const s = deptData.sections[sec];
            html += `
                <tr class="section-row">
                    <td>Section: ${sec}</td>
                    <td>${s.totals.BM.c} tasks <span style="font-size:12px;color:var(--text-subtle);font-weight:400">(${s.totals.BM.h.toFixed(1)}h)</span></td>
                    <td>${s.totals.PM.c} tasks <span style="font-size:12px;color:var(--text-subtle);font-weight:400">(${s.totals.PM.h.toFixed(1)}h)</span></td>
                    <td>${s.totals.PD.c} tasks <span style="font-size:12px;color:var(--text-subtle);font-weight:400">(${s.totals.PD.h.toFixed(1)}h)</span></td>
                    <td><strong>${s.totals.ALL.h.toFixed(1)} hrs</strong></td>
                </tr>`;

            const lines = Object.keys(s.lines).sort((a,b) => a.localeCompare(b, undefined, {numeric:true, sensitivity:'base'}));
            lines.forEach(line => {
                const l = s.lines[line];
                html += `
                    <tr>
                        <td class="line-cell">Line ${line}</td>
                        <td><div class="stat-pill stat-bm"><span>${l.BM.c}</span><span>${l.BM.h.toFixed(1)}h</span></div></td>
                        <td><div class="stat-pill stat-pm"><span>${l.PM.c}</span><span>${l.PM.h.toFixed(1)}h</span></div></td>
                        <td><div class="stat-pill stat-pd"><span>${l.PD.c}</span><span>${l.PD.h.toFixed(1)}h</span></div></td>
                        <td><div class="stat-pill stat-total"><span>Total</span><span>${l.ALL.h.toFixed(1)}h</span></div></td>
                    </tr>`;
            });
        });

        html += `</tbody></table></div></div>
        </div>`;
        document.getElementById('dashboardContent').innerHTML = html;
    }

    // --- ADVANCED RENDER LOGIC ---
    function renderAdvancedView() {
        if (!rawTasks || rawTasks.length === 0) return;

        // 1. Process Data for Charts
        let typeCounts = { BM: 0, PM: 0, PD: 0 };
        let techHours = {};

        const tbody = document.getElementById('rawTableBody');
        tbody.innerHTML = '';

        rawTasks.forEach(t => {
            // Aggregate Types
            if (typeCounts[t.type] !== undefined) typeCounts[t.type]++;
            
            // Aggregate Tech Hours
            const dur = parseFloat(t.duration) || 0;
            if (t.tech) {
                techHours[t.tech] = (techHours[t.tech] || 0) + dur;
            }

            // Build Raw Table Rows
            const cleanTime = new Date(t.time);
            const timeStr = isNaN(cleanTime) ? t.time : cleanTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const typeBadge = `<span class="badge-mini bg-${t.type.toLowerCase()}">${t.type}</span>`;
            
            tbody.innerHTML += `
                <tr>
                    <td style="color:var(--text-muted); font-family:var(--mono); font-size:13px;">${timeStr}</td>
                    <td style="font-weight:600;">${t.tech}</td>
                    <td>${t.dept}</td>
                    <td>${t.section || '-'}</td>
                    <td>${t.line || '-'}</td>
                    <td>${typeBadge}</td>
                    <td>${t.desc}</td>
                    <td style="color:var(--text-muted); font-family:var(--mono); font-size:13px;">${t.timeSpan || '-'}</td>
                    <td style="font-weight:600; font-family:var(--mono);">${dur.toFixed(1)}h</td>
                </tr>
            `;
        });

        // 2. Draw Type Doughnut Chart
        if (typeChartInstance) typeChartInstance.destroy();
        const ctxType = document.getElementById('typeChart').getContext('2d');
        
        // Colors from new palette
        const colors = { bm: '#FF9A62', pm: '#E5FA5E', pd: '#2C2C2C' };
        
        typeChartInstance = new Chart(ctxType, {
            type: 'doughnut',
            data: {
                labels: ['Breakdown (BM)', 'Preventive (PM)', 'Process (PD)'],
                datasets: [{
                    data: [typeCounts.BM, typeCounts.PM, typeCounts.PD],
                    backgroundColor: [colors.bm, colors.pm, colors.pd],
                    borderWidth: 2,
                    borderColor: '#ffffff',
                    hoverOffset: 4
                }]
            },
            options: { 
                responsive: true, 
                maintainAspectRatio: false, 
                cutout: '70%',
                plugins: { 
                    legend: { position: 'right', labels: { font: { family: 'Inter', size: 12 } } } 
                } 
            }
        });

        // 3. Draw Tech Bar Chart
        if (techChartInstance) techChartInstance.destroy();
        
        // Sort techs by most hours
        const sortedTechs = Object.keys(techHours).sort((a,b) => techHours[b] - techHours[a]);
        const techLabels = sortedTechs;
        const techData = sortedTechs.map(tech => techHours[tech]);

        const ctxTech = document.getElementById('techChart').getContext('2d');
        techChartInstance = new Chart(ctxTech, {
            type: 'bar',
            data: {
                labels: techLabels,
                datasets: [{
                    label: 'Total Hours Logged',
                    data: techData,
                    backgroundColor: '#2C2C2C', // Dark bar
                    borderRadius: 8,
                    borderSkipped: false
                }]
            },
            options: { 
                responsive: true, 
                maintainAspectRatio: false, 
                plugins: { legend: { display: false } },
                scales: { 
                    y: { 
                        beginAtZero: true, 
                        grid: { color: 'rgba(0,0,0,0.05)', drawBorder: false },
                        ticks: { font: { family: 'Inter' } }
                    },
                    x: {
                        grid: { display: false, drawBorder: false },
                        ticks: { font: { family: 'Inter', weight: '500' } }
                    }
                }
            }
        });
    }

    // --- REBUILT EXPORT TO EXCEL (HTML to XLS trick for formatting) ---
    function exportExcel() {
        let hasData = false;

        // Inline CSS to style the resulting Excel file natively
        const styles = `
            <style>
                table { border-collapse: collapse; font-family: Arial, sans-serif; }
                th, td { border: 1px solid #d1d5db; padding: 8px; text-align: left; }
                th { background-color: #2c2c2c; color: #ffffff; font-weight: bold; }
                .title-row { font-size: 18px; font-weight: bold; background-color: #ffffff; border: none; }
                .date-row { font-size: 12px; font-weight: normal; background-color: #ffffff; border: none; border-bottom: 2px solid #2c2c2c; padding-bottom: 12px; }
                .subtotal-row td { background-color: #e5e7eb; font-weight: bold; color: #111827; }
                .number { text-align: right; }
            </style>
        `;

        let html = `<html xmlns:x="urn:schemas-microsoft-com:office:excel">
                    <head>
                        <meta charset="utf-8">${styles}
                    </head><body><table>`;

        // Title and Date
        html += `
            <tr><td colspan="10" class="title-row">Shift Logs Admin Master Export - All Departments</td></tr>
            <tr><td colspan="10" class="date-row">Exported on: ${new Date().toLocaleString()}</td></tr>
            <tr>
                <th>Department</th>
                <th>Section</th>
                <th>Line</th>
                <th>BM Count</th>
                <th>BM Hours</th>
                <th>PM Count</th>
                <th>PM Hours</th>
                <th>PD Count</th>
                <th>PD Hours</th>
                <th>Total Hours</th>
            </tr>
        `;

        const departments = ["Assembly", "Formation"];
        departments.forEach(dept => {
            const deptData = aggregatedData[dept];
            if (!deptData || Object.keys(deptData.sections).length === 0) return;
            hasData = true;
            const sections = Object.keys(deptData.sections).sort();

            sections.forEach(sec => {
                const sData = deptData.sections[sec];
                const lines = Object.keys(sData.lines).sort((a,b) => a.localeCompare(b, undefined, {numeric:true, sensitivity:'base'}));

                lines.forEach(line => {
                    const lData = sData.lines[line];
                    html += `<tr>
                        <td>${dept}</td>
                        <td>${sec}</td>
                        <td>${line}</td>
                        <td class="number">${lData.BM.c}</td>
                        <td class="number">${lData.BM.h.toFixed(2)}</td>
                        <td class="number">${lData.PM.c}</td>
                        <td class="number">${lData.PM.h.toFixed(2)}</td>
                        <td class="number">${lData.PD.c}</td>
                        <td class="number">${lData.PD.h.toFixed(2)}</td>
                        <td class="number">${lData.ALL.h.toFixed(2)}</td>
                    </tr>`;
                });
                
                // Formatted Subtotal Row
                html += `<tr class="subtotal-row">
                    <td>${dept}</td>
                    <td>${sec} SUBTOTAL</td>
                    <td></td>
                    <td class="number">${sData.totals.BM.c}</td>
                    <td class="number">${sData.totals.BM.h.toFixed(2)}</td>
                    <td class="number">${sData.totals.PM.c}</td>
                    <td class="number">${sData.totals.PM.h.toFixed(2)}</td>
                    <td class="number">${sData.totals.PD.c}</td>
                    <td class="number">${sData.totals.PD.h.toFixed(2)}</td>
                    <td class="number">${sData.totals.ALL.h.toFixed(2)}</td>
                </tr>`;
            });
        });

        html += `</table></body></html>`;

        if (!hasData) return alert("No data available to export.");

        // Create the download link as an .xls file
        const blob = new Blob([html], { type: "application/vnd.ms-excel" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.setAttribute("href", url);
        link.setAttribute("download", `Shift_Summary_Master_${new Date().toISOString().split('T')[0]}.xls`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
    }
</script>

        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js');
        });
