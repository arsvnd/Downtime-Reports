<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WLED Ultra Modern</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #020617;
            --card-bg: rgba(30, 41, 59, 0.5);
            --accent-color: #38bdf8;
            --text-main: #f8fafc;
            --text-dim: #64748b;
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(56, 189, 248, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(168, 85, 247, 0.1) 0%, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .container { width: 100%; max-width: 450px; padding: 20px; padding-bottom: 100px; }

        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }

        /* Color Wheel Container */
        .picker-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            margin: 20px 0;
        }

        #colorWheel {
            cursor: crosshair;
            border-radius: 50%;
            box-shadow: 0 0 40px rgba(0,0,0,0.5);
            touch-action: none;
        }

        .wheel-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--bg-color);
            border: 4px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 24px;
            margin-bottom: 16px;
        }

        /* Power & Brightness UI */
        .main-controls { display: flex; gap: 15px; align-items: center; }
        
        .power-btn {
            min-width: 70px;
            height: 70px;
            border-radius: 22px;
            border: none;
            background: #1e293b;
            color: white;
            font-size: 1.4rem;
            cursor: pointer;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .power-btn.on {
            background: var(--accent-color);
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.4);
            color: #0f172a;
        }

        .slider-box { flex-grow: 1; }

        input[type=range] {
            width: 100%;
            height: 12px;
            border-radius: 10px;
            background: #1e293b;
            appearance: none;
            outline: none;
        }

        input[type=range]::-webkit-slider-thumb {
            appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: white;
            border: 4px solid var(--accent-color);
            cursor: pointer;
        }

        /* Swatches */
        .swatches {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 20px;
        }

        .swatch {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .swatch.active { border-color: white; transform: scale(1.1); }

        /* Bottom Nav */
        nav {
            position: fixed;
            bottom: 20px;
            width: calc(100% - 40px);
            max-width: 410px;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-around;
            padding: 15px;
            border-radius: 24px;
            border: 1px solid var(--glass-border);
        }

        .nav-item { color: var(--text-dim); font-size: 1.2rem; cursor: pointer; transition: 0.2s; }
        .nav-item.active { color: var(--accent-color); }

    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1 style="font-weight: 700;">Living Room</h1>
            <p id="status-text" style="color: var(--accent-color); font-size: 0.8rem;">● Online</p>
        </div>
        <i class="fas fa-ellipsis-v" style="color: var(--text-dim)"></i>
    </header>

    <div class="picker-container">
        <canvas id="colorWheel" width="300" height="300"></canvas>
        <div class="wheel-center">
            <i class="fas fa-lightbulb" id="bulb-icon" style="font-size: 1.5rem; color: #38bdf8;"></i>
        </div>
        
        <div class="swatches">
            <div class="swatch" style="background: #ff0000;" onclick="setManualColor('#ff0000')"></div>
            <div class="swatch" style="background: #00ff00;" onclick="setManualColor('#00ff00')"></div>
            <div class="swatch" style="background: #0000ff;" onclick="setManualColor('#0000ff')"></div>
            <div class="swatch" style="background: #ffa500;" onclick="setManualColor('#ffa500')"></div>
            <div class="swatch" style="background: #ffffff;" onclick="setManualColor('#ffffff')"></div>
        </div>
    </div>

    <div class="glass-card">
        <div class="main-controls">
            <button class="power-btn on" id="powerBtn" onclick="togglePower()">
                <i class="fas fa-power-off"></i>
            </button>
            <div class="slider-box">
                <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                    <span style="font-size: 0.8rem; color: var(--text-dim);">BRIGHTNESS</span>
                    <span id="bri-val" style="font-size: 0.8rem; font-weight: bold;">80%</span>
                </div>
                <input type="range" id="brightness" min="0" max="255" value="200" oninput="updateBri(this.value)">
            </div>
        </div>
    </div>

    <div class="glass-card" style="padding: 18px;">
        <h3 style="font-size: 1rem; margin-bottom: 15px;">Fast Effects</h3>
        <div style="display: flex; gap: 10px; overflow-x: auto; padding-bottom: 5px;">
            <button onclick="setEffect(0)" style="padding: 10px 20px; border-radius: 14px; border: none; background: #334155; color: white; white-space: nowrap;">Solid</button>
            <button onclick="setEffect(1)" style="padding: 10px 20px; border-radius: 14px; border: none; background: #334155; color: white; white-space: nowrap;">Rainbow</button>
            <button onclick="setEffect(2)" style="padding: 10px 20px; border-radius: 14px; border: none; background: #334155; color: white; white-space: nowrap;">Fire</button>
            <button onclick="setEffect(3)" style="padding: 10px 20px; border-radius: 14px; border: none; background: #334155; color: white; white-space: nowrap;">Sparkle</button>
        </div>
    </div>
</div>

<nav>
    <div class="nav-item active"><i class="fas fa-adjust"></i></div>
    <div class="nav-item"><i class="fas fa-wand-magic-sparkles"></i></div>
    <div class="nav-item"><i class="fas fa-layer-group"></i></div>
    <div class="nav-item"><i class="fas fa-gear"></i></div>
</nav>

<script>
    const canvas = document.getElementById('colorWheel');
    const ctx = canvas.getContext('2d');
    const bulbIcon = document.getElementById('bulb-icon');
    let isPowerOn = true;

    const WLED_IP = '192.168.2.62'; 

async function sendToWLED(data) {
    try {
        await fetch(`http://${WLED_IP}/json/state`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
    } catch (e) {
        console.error("WLED Connection Failed", e);
    }
}

// Updated Power Toggle
function togglePower() {
    isPowerOn = !isPowerOn;
    document.getElementById('powerBtn').classList.toggle('on', isPowerOn);
    sendToWLED({ on: isPowerOn });
}

// Updated Brightness
function updateBri(val) {
    document.getElementById('bri-val').innerText = Math.round((val/255)*100) + '%';
    sendToWLED({ bri: parseInt(val) });
}

// Updated Color Handling
function handleColor(e) {
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX || e.touches[0].clientX) - rect.left;
    const y = (e.clientY || e.touches[0].clientY) - rect.top;
    const pixel = ctx.getImageData(x, y, 1, 1).data;
    
    const rgb = `rgb(${pixel[0]}, ${pixel[1]}, ${pixel[2]})`;
    bulbIcon.style.color = rgb;

    // Send the RGB values to segment 0
    sendToWLED({ seg: [{ col: [[pixel[0], pixel[1], pixel[2]]] }] });
}

    // Generate Color Wheel
    function drawWheel() {
        const radius = canvas.width / 2;
        for (let angle = 0; angle < 360; angle++) {
            const startAngle = (angle - 2) * Math.PI / 180;
            const endAngle = (angle + 2) * Math.PI / 180;
            ctx.beginPath();
            ctx.moveTo(radius, radius);
            ctx.arc(radius, radius, radius, startAngle, endAngle);
            ctx.closePath();
            const gradient = ctx.createRadialGradient(radius, radius, 0, radius, radius, radius);
            gradient.addColorStop(0, 'white');
            gradient.addColorStop(1, `hsl(${angle}, 100%, 50%)`);
            ctx.fillStyle = gradient;
            ctx.fill();
        }
    }

    // Color Handling
    function handleColor(e) {
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX || e.touches[0].clientX) - rect.left;
        const y = (e.clientY || e.touches[0].clientY) - rect.top;
        const pixel = ctx.getImageData(x, y, 1, 1).data;
        const rgb = `rgb(${pixel[0]}, ${pixel[1]}, ${pixel[2]})`;
        
        bulbIcon.style.color = rgb;
        // API Call: fetch(`/win&R=${pixel[0]}&G=${pixel[1]}&B=${pixel[2]}`);
    }

    // Interaction Listeners
    canvas.addEventListener('mousedown', () => {
        canvas.addEventListener('mousemove', handleColor);
    });
    window.addEventListener('mouseup', () => {
        canvas.removeEventListener('mousemove', handleColor);
    });
    canvas.addEventListener('touchstart', (e) => {
        handleColor(e);
        canvas.addEventListener('touchmove', handleColor);
    });
    canvas.addEventListener('touchend', () => {
        canvas.removeEventListener('touchmove', handleColor);
    });

    function togglePower() {
        isPowerOn = !isPowerOn;
        document.getElementById('powerBtn').classList.toggle('on', isPowerOn);
        // API Call: fetch('/win&T=' + (isPowerOn ? 1 : 0));
    }

    function updateBri(val) {
        document.getElementById('bri-val').innerText = Math.round((val/255)*100) + '%';
        // API Call: fetch(`/win&A=${val}`);
    }

    function setManualColor(hex) {
        bulbIcon.style.color = hex;
        // Logic to convert hex and send to WLED
    }

    drawWheel();
</script>
</body>
</html>
