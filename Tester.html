<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PKG Major Downtime Report</title>
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f8fafc;
            --card: #ffffff;
            --card-done: #f1f5f9; /* Soft Professional Tint */
            --text: #0f172a;
            --border: #cbd5e1;
            --success: #059669;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            padding: 15px;
            margin: 0;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        h1 { text-align: center; color: var(--primary); margin: 0 0 25px 0; font-size: 1.8rem; letter-spacing: -0.5px; }
        h3 { border-left: 4px solid var(--primary); padding-left: 10px; margin: 25px 0 15px 0; font-size: 1.1rem; }

        .section-card {
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid #edf2f7;
            transition: background-color 0.4s ease, border-color 0.4s ease;
        }

        .section-card.completed {
            background-color: var(--card-done);
            border-color: var(--border);
        }

        .form-group { margin-bottom: 18px; position: relative; }
        label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.85rem; color: #64748b; text-transform: uppercase; }

        .block-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 8px;
        }

        .block-options label {
            border: 1px solid var(--border);
            padding: 12px 5px;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            background: white;
            transition: all 0.2s;
            font-weight: 500;
            margin: 0;
            text-transform: none;
        }

        .block-options input[type="radio"] { display: none; }
        .block-options label:has(input:checked) {
            border-color: var(--primary);
            background-color: #eff6ff;
            color: var(--primary);
            box-shadow: inset 0 0 0 1px var(--primary);
        }

        /* Fixed Centering for iOS Date/Time */
        input[type="text"], input[type="date"], input[type="time"], select, textarea {
            width: 100%;
            height: 48px; /* Standardized height */
            padding: 0 12px;
            display: flex;
            align-items: center;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            background: #ffffff;
            appearance: none; /* Removes native iOS styling to help centering */
            -webkit-appearance: none;
        }

        textarea { height: auto; min-height: 90px; padding: 12px; resize: vertical; }

        .time-group { display: flex; gap: 8px; }
        .btn-now {
            background: #64748b;
            color: white;
            border: none;
            padding: 0 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: bold;
            white-space: nowrap;
        }

        .textarea-container { position: relative; }
        .mic-btn {
            position: absolute;
            right: 10px;
            top: 10px;
            background: #f1f5f9;
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
        }
        .mic-btn.active { background: #fee2e2; color: #ef4444; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.5; } }

        .hidden { display: none; }
        
        .btn-submit {
            width: 100%;
            background: var(--primary);
            color: white;
            padding: 16px;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2);
        }

        .btn-copy {
            background: var(--success);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 10px;
        }

        #summaryContainer { margin-top: 30px; display: none; }
        #summaryOutput {
            background: #f8fafc;
            padding: 20px;
            border-radius: 8px;
            white-space: pre-wrap;
            font-family: 'Courier New', Courier, monospace;
            border: 1px solid var(--border);
            font-size: 0.95rem;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>PKG Major Downtime Report</h1>
    
    <form id="downtimeForm">
        <div class="section-card" id="card1">
            <div class="form-group">
                <label>1. Stop Type</label>
                <div class="block-options">
                    <label><input type="radio" name="stopType" value="BM" required> BM</label>
                    <label><input type="radio" name="stopType" value="PD"> PD</label>
                    <label><input type="radio" name="stopType" value="Other" id="otherToggle"> Other</label>
                </div>
                <input type="text" id="otherStopType" class="hidden" placeholder="Specify stop type..." style="margin-top:10px;">
            </div>

            <div class="form-group">
                <label>2. Equipment</label>
                <div class="block-options" id="equipmentGroup">
                    <label><input type="radio" name="equipment" value="1-1" required> 1-1</label>
                    <label><input type="radio" name="equipment" value="1-2"> 1-2</label>
                    <label><input type="radio" name="equipment" value="2-1"> 2-1</label>
                    <label><input type="radio" name="equipment" value="2-2"> 2-2</label>
                    <label><input type="radio" name="equipment" value="3-1"> 3-1</label>
                    <label><input type="radio" name="equipment" value="3-2"> 3-2</label>
                </div>
            </div>
        </div>

        <div class="section-card" id="card2">
            <h3>Machine Area</h3>
            <div class="form-group">
                <label>Machine</label>
                <select id="machine" required onchange="updateUnits()">
                    <option value="" disabled selected>Select Machine</option>
                    <option value="Tab Welder">TAB WELDER</option>
                    <option value="Pouch Forming">POUCH</option>
                    <option value="Cell Assembly">CELL ASSY</option>
                    <option value="EL Filling">EL FILLING</option>
                </select>
            </div>

            <div class="form-group">
                <label>Unit</label>
                <select id="unit" required>
                    <option value="" disabled selected>Select Unit</option>
                </select>
            </div>

            <div class="form-group">
                <label>Assembly</label>
                <input type="text" id="assembly" required placeholder="e.g. Forming Press/Lead Vison">
            </div>
        </div>

        <div class="section-card" id="card3">
            <div class="form-group">
                <label>Date</label>
                <input type="date" id="dateInput" required>
            </div>

            <div class="form-group">
                <label>Start Time</label>
                <input type="time" id="startTime" required>
            </div>

            <div class="form-group">
                <label>Issue Resolved?</label>
                <div class="block-options">
                    <label><input type="radio" name="resolved" value="Yes" id="resYes"> Yes</label>
                    <label><input type="radio" name="resolved" value="No" checked> No</label>
                </div>
            </div>

            <div class="form-group hidden" id="endTimeContainer">
                <label>End Time</label>
                <div class="time-group">
                    <input type="time" id="endTime">
                    <button type="button" class="btn-now" onclick="setNow('endTime')">NOW</button>
                </div>
            </div>
        </div>

        <div class="section-card" id="card4">
            <h3>Details</h3>
            <div class="form-group">
                <label>5. Phenomenon</label>
                <div class="textarea-container">
                    <textarea id="phenomenon" required placeholder="Describe what happened..."></textarea>
                    <button type="button" class="mic-btn" onclick="startDictation('phenomenon')">🎤</button>
                </div>
            </div>
            <div class="form-group">
                <label>6. Root Cause</label>
                <div class="textarea-container">
                    <textarea id="rootCause" required placeholder="What caused the issue?"></textarea>
                    <button type="button" class="mic-btn" onclick="startDictation('rootCause')">🎤</button>
                </div>
            </div>
            <div class="form-group">
                <label>7. Action Taken</label>
                <div class="textarea-container">
                    <textarea id="actionTaken" required placeholder="How was the issue fixed?"></textarea>
                    <button type="button" class="mic-btn" onclick="startDictation('actionTaken')">🎤</button>
                </div>
            </div>
        </div>

        <button type="button" class="btn-submit" onclick="generateSummary()">Generate Summary</button>
    </form>

    <div id="summaryContainer">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <label style="color:var(--text)">Generated Summary:</label>
            <button class="btn-copy" onclick="copyToClipboard()">Copy Summary</button>
        </div>
        <div id="summaryOutput"></div>
    </div>
</div>

<script>
    // Initialization
    const now = new Date();
    document.getElementById('dateInput').value = now.toISOString().split('T')[0];
    setNow('startTime');

    function setNow(id) {
        const d = new Date();
        const time = d.getHours().toString().padStart(2, '0') + ":" + d.getMinutes().toString().padStart(2, '0');
        document.getElementById(id).value = time;
        updateStepIndicators();
    }

    function updateUnits() {
        const process = document.getElementById('machine').value;
        const unitSelect = document.getElementById('unit');
        let options = [];

        if (process === 'Tab Welder') options = ['Loader', 'Tab Welder (+)', 'Tab Welder (-)', 'Short Checker', 'LMS'];
        else if (process === 'Pouch Forming') options = ['Al Loader', 'Al Forming', 'Pouch Vision'];
        else if (process === 'Cell Assembly') options = ['Cell Insert', 'Pouch Folding', 'Sealer[1]', 'Sealer[2]'];
        else if (process === 'EL Filling') options = ['Cell Loader', 'BCR Printing', 'Pre-Weight', 'EL-Filling/V-sealing', 'Post-Weight', 'IR Checker', 'Cell Unloader'];

        unitSelect.innerHTML = '<option value="" disabled selected>Select Unit</option>';
        options.forEach(opt => {
            const el = document.createElement('option');
            el.textContent = opt; el.value = opt;
            unitSelect.appendChild(el);
        });
        updateStepIndicators();
    }

    function startDictation(id) {
        if (window.hasOwnProperty('webkitSpeechRecognition')) {
            const recognition = new webkitSpeechRecognition();
            const micBtn = document.querySelector(`#${id} + .mic-btn`);
            recognition.lang = "en-US";
            recognition.start();
            micBtn.classList.add('active');
            recognition.onresult = function(e) {
                document.getElementById(id).value += e.results[0][0].transcript;
                micBtn.classList.remove('active');
                updateStepIndicators();
            };
            recognition.onerror = function() { micBtn.classList.remove('active'); };
        } else {
            alert("Speech to text not supported.");
        }
    }

    function updateStepIndicators() {
        const sections = ['card1', 'card2', 'card3', 'card4'];
        sections.forEach(secId => {
            const card = document.getElementById(secId);
            const requiredFields = card.querySelectorAll('[required]');
            let allFilled = true;

            requiredFields.forEach(field => {
                if (field.type === 'radio') {
                    const name = field.name;
                    if (!card.querySelector(`input[name="${name}"]:checked`)) allFilled = false;
                } else if (!field.value || field.value.trim() === "") {
                    allFilled = false;
                }
            });

            if (allFilled) card.classList.add('completed');
            else card.classList.remove('completed');
        });
    }

    document.addEventListener('input', updateStepIndicators);

    document.getElementsByName('stopType').forEach(el => {
        el.addEventListener('change', () => {
            document.getElementById('otherStopType').classList.toggle('hidden', el.value !== 'Other');
            updateStepIndicators();
        });
    });

    document.getElementsByName('resolved').forEach(el => {
        el.addEventListener('change', (e) => {
            const isYes = e.target.value === 'Yes';
            const endContainer = document.getElementById('endTimeContainer');
            endContainer.classList.toggle('hidden', !isYes);
            const endTimeInput = document.getElementById('endTime');
            if(isYes) {
                endTimeInput.setAttribute('required', 'true');
                setNow('endTime');
            } else {
                endTimeInput.removeAttribute('required');
            }
            updateStepIndicators();
        });
    });

    function formatDate(dateStr) {
        if (!dateStr) return "";
        const date = new Date(dateStr + 'T12:00:00'); 
        return `${date.getDate()} ${date.toLocaleString('default', { month: 'long' })} ${date.getFullYear()}`;
    }

    function formatTime(timeStr) {
        if (!timeStr) return "";
        let [hours, minutes] = timeStr.split(':');
        let ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12 || 12;
        return `${hours.toString().padStart(2, '0')}:${minutes} ${ampm}`;
    }

    function generateSummary() {
        const stopTypeVal = document.querySelector('input[name="stopType"]:checked')?.value;
        const stopType = stopTypeVal === 'Other' ? document.getElementById('otherStopType').value : stopTypeVal;
        const equipment = document.querySelector('input[name="equipment"]:checked')?.value || "";
        const resolved = document.querySelector('input[name="resolved"]:checked').value;

        const summary = `1. Stop Type:
${stopType}

2. Equipment:
${equipment}

3. Machine Area:
    Machine: ${document.getElementById('machine').value}
    Unit: ${document.getElementById('unit').value}
    Assembly: ${document.getElementById('assembly').value}
    Date: ${formatDate(document.getElementById('dateInput').value)}
    Start Time: ${formatTime(document.getElementById('startTime').value)}
    End Time: ${resolved === 'Yes' ? formatTime(document.getElementById('endTime').value) : "-"}
    Issue Resolved: ${resolved === 'Yes' ? "Yes ✅" : "No"}

5. Phenomenon:
${document.getElementById('phenomenon').value}

6. Root Cause:
${document.getElementById('rootCause').value}

7. Action taken:
${document.getElementById('actionTaken').value}`;

        document.getElementById('summaryOutput').innerText = summary;
        document.getElementById('summaryContainer').style.display = 'block';
        document.getElementById('summaryContainer').scrollIntoView({ behavior: 'smooth' });
    }

    function copyToClipboard() {
        const text = document.getElementById('summaryOutput').innerText;
        navigator.clipboard.writeText(text).then(() => {
            const btn = document.querySelector('.btn-copy');
            const originalText = btn.innerText;
            btn.innerText = "✓ Copied!";
            btn.style.background = "#047857";
            setTimeout(() => {
                btn.innerText = originalText;
                btn.style.background = "var(--success)";
            }, 2000);
        });
    }
</script>
</body>
</html>
