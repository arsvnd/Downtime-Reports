       HELPERS
       ========================================= */
    const $ = (id) => document.getElementById(id);
    function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
    function buzz(p) {
        // Browsers block vibration until the first tap; skip it quietly before then.
        if (navigator.vibrate && (!navigator.userActivation || navigator.userActivation.hasBeenActive)) navigator.vibrate(p);
    }
    const niceTime = (t) => (t || '').replace(/(AM|PM)$/, ' $1');

    // Today's date in the phone's local time zone (YYYY-MM-DD).
    // toISOString() uses UTC, which rolls over to tomorrow during the evening in Toronto.
    function localDateStr(d = new Date()) {
        const pad = n => String(n).padStart(2, '0');
        return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    }

    function getNearestTime() {
        const d = new Date();
        let h = d.getHours(), m = d.getMinutes();
        m = m < 15 ? "00" : m < 45 ? "30" : "00";
        if (m === "00" && d.getMinutes() >= 45) h = (h + 1) % 24;
        const ampm = h >= 12 ? "PM" : "AM";
        let hour = h % 12; hour = hour || 12;
        return `${hour}:${m}${ampm}`;
    }

    function timeToMinutes(t) {
        const m = /^(\d{1,2}):(\d{2})(AM|PM)$/.exec(t || '');
        if (!m) return 0;
        let h = +m[1] % 12; if (m[3] === 'PM') h += 12;
        return h * 60 + +m[2];
    }

    function dayLabel(dateStr) {
        if (!dateStr) return 'Earlier';
        if (dateStr === localDateStr()) return 'Today';
        if (dateStr === localDateStr(new Date(Date.now() - 864e5))) return 'Yesterday';
        const [y, mo, d] = dateStr.split('-').map(Number);
        return new Date(y, mo - 1, d).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
    }

    function minsAgo(ts) {
        const m = Math.floor((Date.now() - ts) / 60000);
        return m < 1 ? 'just now' : `${m} min ago`;
    }

    function persistReports() {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(savedReports)); return true; }
        catch (e) { showToast("Couldn't save the report", { sub: 'Phone storage is full or blocked.', type: 'error' }); return false; }
    }

    /* =========================================
       BANNER (toast) + BOTTOM SHEET
       ========================================= */
    let toastTimer = null;
    function showToast(title, { sub = '', type = 'info', ms = 2600 } = {}) {
        let el = $('toast');
        if (!el) {
            el = document.createElement('div');
            el.id = 'toast';
            el.setAttribute('role', 'status');
            el.setAttribute('aria-live', 'polite');
            document.body.appendChild(el);
        }
        el.className = 'toast toast-' + type;
        el.innerHTML = `<strong>${esc(title)}</strong>${sub ? `<span>${esc(sub)}</span>` : ''}`;
        void el.offsetWidth; // restart the slide-in animation
        el.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.classList.remove('show'), ms);
    }

    // Resolves with the chosen action's value, or null if dismissed.
    function showSheet({ title, message = '', bodyHtml = '', actions = [] }) {
        return new Promise(resolve => {
            document.querySelectorAll('.sheet-backdrop').forEach(s => s.remove());
            const el = document.createElement('div');
            el.className = 'sheet-backdrop';
            el.innerHTML = `
                <div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
                    <div class="sheet-grabber"></div>
                    <h3 class="sheet-title">${esc(title)}</h3>
                    ${message ? `<p class="sheet-msg">${esc(message)}</p>` : ''}
                    ${bodyHtml}
                    <div class="sheet-actions">
                        ${actions.map((a, i) => `<button class="sheet-btn sheet-${a.kind || 'secondary'}" data-i="${i}">${esc(a.label)}</button>`).join('')}
                    </div>
                </div>`;
            document.body.appendChild(el);
            buzz(10);
            requestAnimationFrame(() => el.classList.add('show'));
            const done = (v) => { el.classList.remove('show'); setTimeout(() => el.remove(), 300); resolve(v); };
            el.addEventListener('click', (e) => {
                if (e.target === el) return done(null);
                const b = e.target.closest('[data-i]');
                if (b) done(actions[+b.dataset.i].value);
            });
        });
    }

    function kiddingBanner() {
        buzz([30, 40, 30]);
        showToast("Are you kidding me?", { sub: "Upper isn't available on Line 1-H.", type: 'warn' });
    }

    /* =========================================
       INIT
       ========================================= */
    function init() {
        try { savedReports = JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch(e) { savedReports = []; }

        const lineSelect = $('lineSelect');
        lineSelect.add(new Option('Select Line', ''));
        lineSelect.options[0].disabled = true;
        lineSelect.options[0].selected = true;
        LINES.forEach(l => lineSelect.add(new Option(`Line ${l}`, l)));

        // INTERLOCK: Enforce 1-H "Upper" restriction when changing lines
        lineSelect.addEventListener('change', function() {
            if (this.value !== '1-H') return;
            let kidding = false;
            if (selectedCutters.includes('Upper')) {
                selectedCutters = selectedCutters.filter(x => x !== 'Upper');
                setCutterBlocks();
                updateChecklistUI();
                kidding = true;
            }
            if (selectedModules.includes('Upper')) {
                selectedModules = selectedModules.filter(x => x !== 'Upper');
                setModuleBlocks();
                kidding = true;
            }
            if (kidding) kiddingBanner();
        });

        const timeSelect = $('timeInput');
        for (let h = 0; h < 24; h++) {
            for (let m of ["00", "30"]) {
                const ampm = h >= 12 ? "PM" : "AM";
                let hour = h % 12; hour = hour || 12;
                timeSelect.add(new Option(`${hour}:${m}${ampm}`, `${hour}:${m}${ampm}`));
            }
        }

        buildInputContainers();

        // Save the draft right away if the app is closed or the phone locks.
        document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') saveDraftNow(); });
        window.addEventListener('pagehide', saveDraftNow);

        initHomeSheet();
        showScreen('screen-home');
        startUpdateChecks();
    }

    function showScreen(screenId) {
        buzz(10);
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        $(screenId).classList.add('active');
        $('nav-back').style.visibility = (screenId === 'screen-home') ? 'hidden' : 'visible';
        document.querySelector('header').classList.toggle('on-home', screenId === 'screen-home');
        if (screenId === 'screen-home') {
            renderHome();
            requestAnimationFrame(layoutHomeSheet);
            setTimeout(applyUpdateIfSafe, 400);
        }
    }

    /* =========================================
       HOME: pull-up "My Cutter Changes" sheet
       Collapsed, it starts just below the green card. Drag it up (or tap the
       handle) to open it; once open the list scrolls, and dragging down from
       the top of the list closes it again.
       ========================================= */
    const homeSheet = { y: 0, collapsedY: 0, expanded: false };
    let clickSuppressed = false;
    function suppressClick() { clickSuppressed = true; setTimeout(() => { clickSuppressed = false; }, 350); }

    function setSheetY(y, animate) {
        const el = $('changes-sheet');
        el.classList.toggle('animating', !!animate);
        homeSheet.y = y;
        el.style.transform = `translateY(${y}px)`;
    }

    function setSheetExpanded(expanded, animate = true) {
        homeSheet.expanded = expanded;
        $('changes-sheet').classList.toggle('expanded', expanded);
        if (!expanded) $('cs-list').scrollTop = 0;
        setSheetY(expanded ? 0 : homeSheet.collapsedY, animate);
    }

    function layoutHomeSheet() {
        if (!$('screen-home').classList.contains('active')) return;
        const el = $('changes-sheet'), hero = $('hero-card');
        const heroBottom = hero.offsetTop + hero.offsetHeight;
        const sheetTop = el.offsetTop, sheetH = el.offsetHeight;
        // Start just below the green card, but always leave the header and a card visible.
        homeSheet.collapsedY = Math.max(0, Math.min(heroBottom + 16 - sheetTop, sheetH - 170));
        setSheetY(homeSheet.expanded ? 0 : homeSheet.collapsedY, false);
    }

    function initHomeSheet() {
        const el = $('changes-sheet'), list = $('cs-list'), handle = $('cs-handle');
        let drag = null;

        const begin = (y, target) => {
            drag = { y0: y, sheet0: homeSheet.y, t0: performance.now(), mode: null, moved: false, inList: list.contains(target) };
        };
        const move = (y, e) => {
            if (!drag) return;
            const dy = y - drag.y0;
            if (!drag.mode) {
                if (Math.abs(dy) < 3) return;
                drag.moved = true;
                if (!homeSheet.expanded) drag.mode = 'sheet';
                else if (drag.inList && (list.scrollTop > 0 || dy < 0)) drag.mode = 'scroll';   // let the list scroll
                else drag.mode = 'sheet';
                if (drag.mode === 'sheet') el.classList.remove('animating');
            }
            if (drag.mode !== 'sheet') return;
            if (e && e.cancelable) e.preventDefault();
            let ny = drag.sheet0 + dy;
            if (ny < 0) ny /= 3;                                                     // rubber-band past the top
            if (ny > homeSheet.collapsedY) ny = homeSheet.collapsedY + (ny - homeSheet.collapsedY) / 3;
            setSheetY(ny, false);
        };
        const end = (y) => {
            if (!drag) return;
            const d = drag; drag = null;
            if (d.moved) suppressClick();
            if (d.mode !== 'sheet') return;
            const v = (y - d.y0) / Math.max(1, performance.now() - d.t0);           // px per ms
            const expand = v < -0.35 ? true : v > 0.35 ? false : homeSheet.y < homeSheet.collapsedY / 2;
            setSheetExpanded(expand);
        };

        el.addEventListener('touchstart', e => begin(e.touches[0].clientY, e.target), { passive: true });
        el.addEventListener('touchmove', e => move(e.touches[0].clientY, e), { passive: false });
        el.addEventListener('touchend', e => end(e.changedTouches[0].clientY));
        el.addEventListener('touchcancel', e => end(e.changedTouches[0].clientY));

        // Mouse: drag the handle (desktop browsers)
        handle.addEventListener('pointerdown', e => {
            if (e.pointerType !== 'mouse') return;
            begin(e.clientY, e.target);
            const mm = ev => move(ev.clientY, ev);
            const mu = ev => { end(ev.clientY); window.removeEventListener('pointermove', mm); window.removeEventListener('pointerup', mu); };
            window.addEventListener('pointermove', mm);
            window.addEventListener('pointerup', mu);
        });

        // A drag shouldn't also open the card under the finger
        el.addEventListener('click', e => { if (clickSuppressed) { e.stopPropagation(); e.preventDefault(); } }, true);
        handle.addEventListener('click', () => setSheetExpanded(!homeSheet.expanded));
        handle.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setSheetExpanded(!homeSheet.expanded); } });

        // Trackpad / mouse wheel
        el.addEventListener('wheel', e => {
            if (!homeSheet.expanded && e.deltaY > 0) { e.preventDefault(); setSheetExpanded(true); }
            else if (homeSheet.expanded && list.scrollTop <= 0 && e.deltaY < -12) { setSheetExpanded(false); }
        }, { passive: false });

        window.addEventListener('resize', layoutHomeSheet);
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(layoutHomeSheet);
    }

    /* =========================================
       AUTO-UPDATE
       Phones often keep the app open in the background for days. When it comes
       back to the foreground (and every 15 min while open), check GitHub Pages
       for a newer version of this page. If there is one, reload as soon as the
       person is on the home screen, so nobody loses what they're typing.
       ========================================= */
    let pageVersion = null;
    let updatePending = false;

    async function fetchPageVersion() {
        try {
            const r = await fetch('Cutter_ID_Generator.html', { method: 'HEAD', cache: 'no-store' });
            if (!r.ok) return null;
            return r.headers.get('ETag') || r.headers.get('Last-Modified');
        } catch (e) { return null; }   // offline: try again later
    }

    async function checkForUpdate() {
        if (updatePending || document.visibilityState !== 'visible') return;
        navigator.serviceWorker?.getRegistration().then(reg => reg && reg.update()).catch(() => {});
        const v = await fetchPageVersion();
        if (!v) return;
        if (pageVersion === null) { pageVersion = v; return; }
        if (v !== pageVersion) { updatePending = true; applyUpdateIfSafe(); }
    }

    function applyUpdateIfSafe() {
        if (!updatePending) return;
        const onHome = document.querySelector('.screen.active')?.id === 'screen-home';
        if (!onHome || document.querySelector('.sheet-backdrop')) return;  // wait until they're done
        try { sessionStorage.setItem('cid_just_updated', '1'); } catch (e) {}
        location.reload();
    }

    function startUpdateChecks() {
        try {
            if (sessionStorage.getItem('cid_just_updated')) {
                sessionStorage.removeItem('cid_just_updated');
                setTimeout(() => showToast('App updated', { sub: "You're on the latest version.", type: 'success' }), 500);
            }
        } catch (e) {}
        checkForUpdate();
        document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkForUpdate(); });
        window.addEventListener('online', checkForUpdate);
        setInterval(checkForUpdate, UPDATE_CHECK_MS);
    }

    function handleBack() {
        const activeScreen = document.querySelector('.screen.active').id;
        if (activeScreen === 'screen-review') {
            showScreen(reviewMode === 'edit' ? 'screen-form' : 'screen-home');
        } else if (activeScreen === 'screen-form') {
            leaveForm();
        }
    }

    /* =========================================
       FORM STATE (shared by drafts, edits, saves)
       ========================================= */
    function idInput(type, cutter, idx) {
        return document.querySelector(`input[data-type="${type}"][data-cutter="${cutter}"][data-idx="${idx}"]`);
    }

    function getFormState() {
        const taskStates = {};
        document.querySelectorAll('.check-input-toggle').forEach(t => { taskStates[t.dataset.taskId] = t.dataset.state; });
        const ids = { old: {}, new: {} };
        selectedCutters.forEach(c => ['old', 'new'].forEach(t => { ids[t][c] = [idInput(t, c, 0).value, idInput(t, c, 1).value]; }));
        const moduleDetails = {};
        selectedModules.forEach(m => {
            moduleDetails[m] = { old: $(`old-mod-${m}`).value, new: $(`new-mod-${m}`).value, reason: $(`reason-mod-${m}`).value };
        });
        return {
            line: $('lineSelect').value,
            date: $('dateInput').value,
            time: $('timeInput').value,
            remarks: $('remarksInput').value,
            includeChecklist: $('includeChecklistToggle').checked,
            cutters: [...selectedCutters],
            ids,
            taskStates,
            includeModules: $('moduleReplacementToggle').checked,
            modules: [...selectedModules],
            moduleDetails
        };
    }

    function isFormPristine(s) {
        return !s.line && !s.cutters.length && !s.modules.length && !s.remarks.trim()
            && !Object.values(s.taskStates).some(v => v !== 'none');
    }

    function setCutterBlocks() {
        const any = selectedCutters.length > 0;
        $('old-group').style.display = any ? 'block' : 'none';
        $('new-group').style.display = any ? 'block' : 'none';
        CUTTER_ORDER.forEach(c => ['old', 'new'].forEach(t => {
            const block = $(`${t}-block-${c}`);
            const on = selectedCutters.includes(c);
            block.style.display = on ? 'block' : 'none';
            block.classList.toggle('visible', on);
        }));
        document.querySelectorAll('.cutter-btn:not(.module-btn)').forEach(btn => btn.classList.toggle('active', selectedCutters.includes(btn.dataset.cutter)));
    }

    function setModuleBlocks() {
        CUTTER_ORDER.forEach(m => { $(`module-block-${m}`).style.display = selectedModules.includes(m) ? 'block' : 'none'; });
        document.querySelectorAll('.module-btn').forEach(btn => btn.classList.toggle('active', selectedModules.includes(btn.dataset.module)));
    }

    function resetForm() {
        activeEditId = null;
        $('lineSelect').value = "";
        $('dateInput').value = localDateStr();
        $('timeInput').value = getNearestTime();
        $('remarksInput').value = "";
        $('includeChecklistToggle').checked = false;
        toggleChecklist();
        $('moduleReplacementToggle').checked = false;
        toggleModuleReplacement();
        selectedModules = [];
        selectedCutters = [];
        CUTTER_ORDER.forEach(m => ['old', 'new', 'reason'].forEach(k => { $(`${k}-mod-${m}`).value = ""; }));
        document.querySelectorAll('.id-input').forEach(input => {
            input.value = '';
            input.closest('.id-input-wrapper').classList.remove('is-complete');
        });
        setCutterBlocks();
        setModuleBlocks();
        updateChecklistUI();
        clearMissingMarks();
        const body = document.querySelector('#screen-form .scrollable-body');
        if (body) body.scrollTop = 0;
    }

    function applyFormState(s) {
        resetForm();
        $('lineSelect').value = LINES.includes(s.line) ? s.line : "";
        $('dateInput').value = s.date || localDateStr();
        $('timeInput').value = s.time || getNearestTime();
        $('remarksInput').value = s.remarks || "";
        $('includeChecklistToggle').checked = !!s.includeChecklist;
        toggleChecklist();
        $('moduleReplacementToggle').checked = !!s.includeModules;
        toggleModuleReplacement();

        selectedModules = [...(s.modules || [])];
        setModuleBlocks();
        selectedModules.forEach(m => {
            const d = s.moduleDetails?.[m] || {};
            $(`old-mod-${m}`).value = d.old || "";
            $(`new-mod-${m}`).value = d.new || "";
            $(`reason-mod-${m}`).value = d.reason || "";
        });

        selectedCutters = [...(s.cutters || [])];
        setCutterBlocks();
        selectedCutters.forEach(c => ['old', 'new'].forEach(t => [0, 1].forEach(i => {
            const inp = idInput(t, c, i);
            inp.value = s.ids?.[t]?.[c]?.[i] || "";
            inp.closest('.id-input-wrapper').classList.toggle('is-complete', inp.value.length === 4);
        })));

        updateChecklistUI();
        if (s.taskStates) {
            document.querySelectorAll('.check-input-toggle').forEach(t => {
                const v = s.taskStates[t.dataset.taskId];
                if (v) t.dataset.state = v;
            });
        }
    }

    /* =========================================
       DRAFTS (kept for 1 hour after the last edit)
       ========================================= */
    let draftTimer = null;

    function loadDraft() {
        try {
            const d = JSON.parse(localStorage.getItem(DRAFT_KEY));
            if (!d) return null;
            if (Date.now() - d.savedAt > DRAFT_TTL_MS) { clearDraft(); return null; }
            return d;
        } catch (e) { return null; }
    }

    function clearDraft() {
        clearTimeout(draftTimer);
        try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
    }

    function isEditingForm() {
        const a = document.querySelector('.screen.active')?.id;
        return a === 'screen-form' || (a === 'screen-review' && reviewMode === 'edit');
    }

    function saveDraftNow() {
        clearTimeout(draftTimer);
        if (!formDirty || !isEditingForm()) return;
        const s = getFormState();
        if (activeEditId === null && isFormPristine(s)) { clearDraft(); return; }
        try { localStorage.setItem(DRAFT_KEY, JSON.stringify({ ...s, editId: activeEditId, savedAt: Date.now() })); } catch (e) {}
    }

    function markDirty() {
        formDirty = true;
        clearTimeout(draftTimer);
        draftTimer = setTimeout(saveDraftNow, 400);
    }

    function draftSummary(d) {
        const line = LINES.includes(d.line) ? `Line ${d.line}` : 'No line yet';
        const cutters = d.cutters?.length ? d.cutters.join(', ') : 'no cutters yet';
        return `${line} · ${cutters}`;
    }

    function resumeDraft() {
        const d = loadDraft();
        if (!d) { showToast('That draft has expired'); renderHome(); return; }
        applyFormState(d);
        activeEditId = d.editId ?? null;
        formDirty = true;
        showScreen('screen-form');
    }

    async function discardDraftFromHome() {
        const choice = await showSheet({
            title: 'Discard this draft?',
            message: "What you typed will be deleted. This can't be undone.",
            actions: [
                { label: 'Discard draft', value: 'discard', kind: 'danger' },
                { label: 'Cancel', value: null, kind: 'plain' }
            ]
        });
        if (choice !== 'discard') return;
        clearDraft();
        renderHome();
        showToast('Draft discarded');
    }

    // If a draft exists, ask what to do with it first. Returns false if the user cancelled or resumed.
    async function handleExistingDraft(continueLabel, skipIfEditId) {
        const d = loadDraft();
        if (!d || (skipIfEditId !== undefined && d.editId === skipIfEditId)) return true;
        const choice = await showSheet({
            title: 'You have an unfinished report',
            message: `${draftSummary(d)} · saved ${minsAgo(d.savedAt)}.`,
            actions: [
                { label: 'Resume it', value: 'resume', kind: 'primary' },
                { label: continueLabel, value: 'continue', kind: 'danger' },
                { label: 'Cancel', value: null, kind: 'plain' }
            ]
        });
        if (choice === 'resume') { resumeDraft(); return false; }
        if (choice !== 'continue') return false;
        clearDraft();
        return true;
    }

    async function leaveForm() {
        const s = getFormState();
        if (!formDirty) { showScreen('screen-home'); return; }
        if (activeEditId === null && isFormPristine(s)) { clearDraft(); formDirty = false; showScreen('screen-home'); return; }
        const choice = await showSheet({
            title: activeEditId ? 'Leave without saving changes?' : 'Leave this report?',
            message: 'Keep it as a draft for an hour and pick it up from the home screen, or discard it.',
            actions: [
                { label: 'Keep as draft', value: 'keep', kind: 'primary' },
                { label: 'Discard', value: 'discard', kind: 'danger' },
                { label: 'Stay here', value: null, kind: 'plain' }
            ]
        });
        if (choice === 'keep') {
            saveDraftNow();
            formDirty = false;
            showScreen('screen-home');
            showToast('Draft saved', { sub: 'Kept for 1 hour' });
        } else if (choice === 'discard') {
            clearDraft();
            formDirty = false;
            showScreen('screen-home');
        }
    }

    /* =========================================
       HOME: draft card + recent changes
       ========================================= */
    function reportSortKey(r) {
        if (r.date) {
            const [y, mo, d] = r.date.split('-').map(Number);
            return new Date(y, mo - 1, d).getTime() + timeToMinutes(r.time) * 60000;
        }
        return r.timestamp || r.id || 0;
    }

    function reportHasGaps(r) {
        return /LCAGHY\d*_|Line: Not Selected|Module ID: N\/A/.test(r.text || '');
    }

    function renderHome() {
        const draft = loadDraft();
        $('draft-slot').innerHTML = draft ? `
            <div class="draft-card">
                <span class="ico ico-peach">${ICONS.clock}</span>
                <div class="draft-text">
                    <strong>${draft.editId ? 'Unsaved edits' : 'Unfinished report'} · ${esc(minsAgo(draft.savedAt))}</strong>
                    <span>${esc(draftSummary(draft))} · kept until ${esc(new Date(draft.savedAt + DRAFT_TTL_MS).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }))}</span>
                </div>
                <button class="draft-x" aria-label="Discard draft" onclick="discardDraftFromHome()">${ICONS.close}</button>
                <button class="btn-small btn-dark" onclick="resumeDraft()">Resume</button>
            </div>` : '';

        const list = $('recent-list');
        const sorted = [...savedReports].sort((a, b) => reportSortKey(b) - reportSortKey(a));
        $('recent-count').textContent = sorted.length ? String(sorted.length) : '';
        if (sorted.length === 0) {
            list.innerHTML = `
                <div class="empty-recent">
                    <span class="ico ico-lime">${ICONS.list}</span>
                    <p>No cutter changes yet.<br>Saved reports will show up here.</p>
                </div>`;
            return;
        }

        let html = '';
        let lastDay = null;
        sorted.forEach(r => {
            const day = dayLabel(r.date);
            if (day !== lastDay) { html += `<div class="day-label">${esc(day)}</div>`; lastDay = day; }

            const lineShort = LINES.includes(r.line) ? r.line : '—';
            // A replaced module includes its cutter, so show the module instead of that cutter.
            const modules = (r.includeModules && r.modules) ? r.modules : [];
            const cutters = (r.cutters || []).filter(c => !modules.includes(c));
            const chips = CUTTER_ORDER.map(pos => {
                if (modules.includes(pos)) return `<span class="chip chip-module">${ICONS.module}${esc(pos)} module</span>`;
                if (cutters.includes(pos)) return `<span class="chip chip-${pos}">${esc(pos)}</span>`;
                return '';
            }).join('');

            const meta = [];
            if (r.includeChecklist && r.taskStates) {
                const vals = Object.values(r.taskStates);
                if (vals.length) meta.push(`Checklist ${vals.filter(v => v === 'yes').length}/${vals.length}`);
            }
            if (r.remarks && r.remarks.trim()) meta.push(r.remarks.trim().replace(/\s+/g, ' '));

            html += `
                <button class="rc-card" onclick="viewReport(${Number(r.id)})">
                    <div class="rc-line"><small>LINE</small><b>${esc(lineShort)}</b></div>
                    <div class="rc-body">
                        <div class="rc-top">
                            <span class="rc-time">${esc(niceTime(r.time))}</span>
                            ${reportHasGaps(r) ? '<span class="badge-warn">Has gaps</span>' : ''}
                        </div>
                        <div class="rc-chips">${chips || '<span class="rc-muted">No cutters</span>'}</div>
                        ${meta.length ? `<div class="rc-meta">${esc(meta.join(' · '))}</div>` : ''}
                    </div>
                    <span class="rc-go">${ICONS.go}</span>
                </button>`;
        });
        list.innerHTML = html;
    }

    /* =========================================
       NEW / EDIT / DELETE
       ========================================= */
    async function openNewForm() {
        if (!(await handleExistingDraft('Start new (discard it)'))) return;
        resetForm();
        formDirty = false;
        showScreen('screen-form');
    }

    async function editReport(id) {
        const report = savedReports.find(r => r.id === id);
        if (!report) return;
        const d = loadDraft();
        if (d && d.editId === id) { resumeDraft(); return; }   // already has unsaved edits for this report
        if (!(await handleExistingDraft('Discard it and edit this one'))) return;
        applyFormState(report);
        activeEditId = report.id;
        formDirty = false;
        showScreen('screen-form');
    }

    async function deleteReport(id) {
        const report = savedReports.find(r => r.id === id);
        if (!report) return;
        const lineTxt = LINES.includes(report.line) ? `Line ${report.line}` : 'This report';
        const choice = await showSheet({
            title: 'Delete this report?',
            message: `${lineTxt} · ${dayLabel(report.date)} ${niceTime(report.time)}. This can't be undone.`,
            actions: [
                { label: 'Delete report', value: 'delete', kind: 'danger' },
                { label: 'Cancel', value: null, kind: 'plain' }
            ]
        });
        if (choice !== 'delete') return;
        savedReports = savedReports.filter(r => r.id !== id);
        persistReports();
        const d = loadDraft();
        if (d && d.editId === id) clearDraft();
        showScreen('screen-home');
        showToast('Report deleted');
    }

    /* =========================================
       FORM INTERACTIONS
       ========================================= */
    function toggleCutter(element) {
        const c = element.dataset.cutter;

        // INTERLOCK: Prevent selection if "Upper" and Line 1-H
        if (!selectedCutters.includes(c) && c === 'Upper' && $('lineSelect').value === '1-H') {
            kiddingBanner();
            return;
        }

        buzz(10);
        if (selectedCutters.includes(c)) {
            selectedCutters = selectedCutters.filter(x => x !== c);
        } else {
            selectedCutters.push(c);
            selectedCutters.sort((a, b) => CUTTER_ORDER.indexOf(a) - CUTTER_ORDER.indexOf(b));
        }
        element.closest('.cutter-checkboxes').classList.remove('is-missing');
        setCutterBlocks();
        updateChecklistUI();
        markDirty();
    }

    function toggleModuleReplacement() {
        $('moduleReplacementContainer').style.display = $('moduleReplacementToggle').checked ? 'block' : 'none';
    }

    function toggleModule(element) {
        const m = element.dataset.module;

        // INTERLOCK: Prevent selection if "Upper" and Line 1-H
        if (!selectedModules.includes(m) && m === 'Upper' && $('lineSelect').value === '1-H') {
            kiddingBanner();
            return;
        }

        buzz(10);
        if (selectedModules.includes(m)) {
            selectedModules = selectedModules.filter(x => x !== m);
        } else {
            selectedModules.push(m);
            selectedModules.sort((a, b) => CUTTER_ORDER.indexOf(a) - CUTTER_ORDER.indexOf(b));
        }
        element.closest('.cutter-checkboxes').classList.remove('is-missing');
        setModuleBlocks();
        markDirty();
    }

    function toggleChecklist() {
        $('checklistItemsContainer').style.display = $('includeChecklistToggle').checked ? 'block' : 'none';
    }

    function cycleToggle(el) {
        buzz(10);
        const states = ['none', 'yes', 'no'];
        el.dataset.state = states[(states.indexOf(el.dataset.state) + 1) % states.length];
        el.classList.remove('is-missing');
        markDirty();
    }

    function buildInputContainers() {
        const container = $('dynamic-ids-container');
        let oldHtml = `<div id="old-group" style="display:none;">`;
        let newHtml = `<div id="new-group" style="display:none;">`;

        CUTTER_ORDER.forEach(c => {
            const format = FORMATS[c];
            const generateInputs = (type) => [0, 1].map(i => `
                <div class="id-input-wrapper"${i === 1 ? ' style="margin-bottom:0;"' : ''}>
                    <span>${format.prefix}</span>
                    <input class="id-input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="____" data-cutter="${c}" data-type="${type}" data-idx="${i}">
                    <span>${format.suffixes[i]}</span>
                </div>`).join('');

            oldHtml += `
                <div id="old-block-${c}" class="cutter-block card" style="display:none;">
                    <div class="card-head"><span class="ico ico-peach">${ICONS.out}</span><h2>OLD ${c}</h2></div>
                    ${generateInputs('old')}
                </div>`;
            newHtml += `
                <div id="new-block-${c}" class="cutter-block card" style="display:none;">
                    <div class="card-head"><span class="ico ico-lime">${ICONS.in}</span><h2>NEW ${c}</h2></div>
                    ${generateInputs('new')}
                </div>`;
        });
        container.innerHTML = oldHtml + `</div>` + newHtml + `</div>`;

        let modHtml = '';
        CUTTER_ORDER.forEach(m => {
            modHtml += `
                <div id="module-block-${m}" class="module-block" style="display:none;">
                    <h4>${m} Module</h4>
                    <div class="form-group">
                        <label>OLD Module ID</label>
                        <input type="text" class="form-input" id="old-mod-${m}" placeholder="Enter OLD ID">
                    </div>
                    <div class="form-group">
                        <label>NEW Module ID</label>
                        <input type="text" class="form-input" id="new-mod-${m}" placeholder="Enter NEW ID">
                    </div>
                    <div class="form-group" style="margin-bottom:0;">
                        <label>Reason for Replacement</label>
                        <textarea id="reason-mod-${m}" style="height:60px;" placeholder="Reason for replacement..."></textarea>
                    </div>
                </div>`;
        });
        $('dynamic-modules-container').innerHTML = modHtml;
    }

    function updateChecklistUI() {
        let dynamicTitles = [];
        CHECKLIST_RULES.forEach(rule => {
            if (rule.condition(selectedCutters)) { dynamicTitles.push(...rule.tasks); }
        });

        dynamicTitles = [...new Set(dynamicTitles)];
        const allItems = dynamicTitles.map(t => ({ id: "dyn_" + t.replace(/\s/g, ''), title: t, desc: t }));
        const container = $('checklistItemsContainer');

        if (allItems.length === 0) { container.innerHTML = ""; return; }

        container.innerHTML = `<div class="card ck-card">` + allItems.map(item => `
            <div class="ck-row">
                <span class="ck-title" onclick="cycleToggle(this.nextElementSibling)">${esc(item.title)}</span>
                <div class="three-way-toggle check-input-toggle" data-task-id="${esc(item.id)}" data-task-desc="${esc(item.desc)}" data-state="none" onclick="cycleToggle(this)">
                    <div class="thumb"></div>
                </div>
            </div>
        `).join("") + `</div>`;
    }

    $("content").addEventListener("focusin", e => {
        if (e.target.classList.contains("id-input")) {
            setTimeout(() => e.target.scrollIntoView({ behavior: 'smooth', block: 'center' }), 150);
        }
    });

    // Any typing or picker change on the form: clear its red mark and save the draft.
    ["input", "change"].forEach(type => $("content").addEventListener(type, e => {
        if (!isEditingForm()) return;
        e.target.classList.remove('is-missing');
        e.target.closest('.id-input-wrapper')?.classList.remove('is-missing');
        markDirty();
    }));

    $("content").addEventListener("input", e => {
        if (e.target.classList.contains("id-input")) {
            let val = e.target.value.replace(/\D/g, "").slice(0, 4);
            e.target.value = val;
            const wrapper = e.target.closest('.id-input-wrapper');

            if (val.length === 4) {
                wrapper.classList.add('is-complete');
                buzz([15, 30]);
                const allVisibleInputs = Array.from(document.querySelectorAll('.cutter-block.visible .id-input'));
                const currentIndex = allVisibleInputs.indexOf(e.target);
                if (currentIndex >= 0 && currentIndex < allVisibleInputs.length - 1) {
                    allVisibleInputs[currentIndex + 1].focus();
                }
            } else {
                wrapper.classList.remove('is-complete');
            }
        }
    });

    $("content").addEventListener("paste", e => {
        if (e.target.classList.contains("id-input")) {
            const pasteData = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, "");
            if (pasteData.length === 8) {
                e.preventDefault();
                e.target.value = pasteData.slice(0, 4);
                e.target.closest('.id-input-wrapper').classList.add('is-complete');
                e.target.closest('.id-input-wrapper').classList.remove('is-missing');
                const allVisibleInputs = Array.from(document.querySelectorAll('.cutter-block.visible .id-input'));
                const currentIndex = allVisibleInputs.indexOf(e.target);
                if (currentIndex >= 0 && currentIndex < allVisibleInputs.length - 1) {
                    const nextInput = allVisibleInputs[currentIndex + 1];
                    nextInput.value = pasteData.slice(4, 8);
                    nextInput.closest('.id-input-wrapper').classList.add('is-complete');
                    nextInput.closest('.id-input-wrapper').classList.remove('is-missing');
                    buzz([15, 50, 15]);
                    nextInput.focus();
                }
                markDirty();
            }
        }
    });

    $("content").addEventListener("keydown", e => {
        if (e.target.classList.contains("id-input") && e.key === "Backspace" && e.target.value === "") {
            e.preventDefault();
            const allVisibleInputs = Array.from(document.querySelectorAll('.cutter-block.visible .id-input'));
            const currentIndex = allVisibleInputs.indexOf(e.target);
            if (currentIndex > 0) {
                const prevInput = allVisibleInputs[currentIndex - 1];
                prevInput.focus();
                const val = prevInput.value; prevInput.value = ''; prevInput.value = val;
            }
        }
    });

    /* =========================================
       GAP CHECKS
       ========================================= */
    function collectIssues() {
        const issues = [];
        const line = $('lineSelect');
        if (!line.value) issues.push({ msg: 'No production line selected', el: line });

        const includeModules = $('moduleReplacementToggle').checked;
        if (!selectedCutters.length && !(includeModules && selectedModules.length)) {
            issues.push({ msg: 'No cutters or modules selected', el: document.querySelector('#screen-form .card .cutter-checkboxes') });
        }

        selectedCutters.forEach(c => ['old', 'new'].forEach(t => [0, 1].forEach(i => {
            const inp = idInput(t, c, i);
            const v = inp.value;
            if (v.length < 4) {
                issues.push({
                    msg: `${t.toUpperCase()} ${c} — ${i === 0 ? '1st' : '2nd'} ID ${v ? `incomplete (${v.length} of 4 digits)` : 'missing'}`,
                    el: inp, mark: inp.closest('.id-input-wrapper')
                });
            }
        })));

        if (includeModules) {
            if (!selectedModules.length) {
                issues.push({ msg: 'Module Replacement is on, but no module is selected', el: $('moduleReplacementContainer').querySelector('.cutter-checkboxes') });
            }
            selectedModules.forEach(m => [['old', 'OLD'], ['new', 'NEW']].forEach(([k, label]) => {
                const inp = $(`${k}-mod-${m}`);
                if (!inp.value.trim()) issues.push({ msg: `${m} module — ${label} module ID missing`, el: inp });
            }));
        }

        return issues;
    }

    function clearMissingMarks() {
        document.querySelectorAll('.is-missing').forEach(el => el.classList.remove('is-missing'));
    }

    function markMissing(issues) {
        clearMissingMarks();
        issues.forEach(i => (i.marks || [i.mark || i.el]).forEach(el => el && el.classList.add('is-missing')));
    }

    function goToIssue(index) {
        const issue = currentIssues[index];
        showScreen('screen-form');
        if (!issue || !issue.el) return;
        setTimeout(() => {
            issue.el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            if (issue.el.matches('input, textarea')) issue.el.focus({ preventScroll: true });
        }, 220);
    }

    function highlightReport(text) {
        return esc(text)
            .replace(/\u0001([^\u0002]*)\u0002/g, '<mark class="unmarked">$1</mark>')
            .replace(/(LCAGHY)(\d*_+)/g, '$1<mark>$2</mark>')
            .replace(/(Line: )(Not Selected)/g, '$1<mark>$2</mark>')
            .replace(/(Module ID: )(N\/A)/g, '$1<mark>$2</mark>');
    }


    /* =========================================
       REVIEW, SAVE & COPY
       ========================================= */
    function goToReview() {
        const dateObj = new Date($('dateInput').value + "T00:00:00");
        const month = dateObj.toLocaleDateString("en-US", { month: "short" }).toUpperCase();
        const time = $('timeInput').value;
        const line = $('lineSelect').value || 'Not Selected';
        const remarks = $('remarksInput').value.trim();
        const includeChecklist = $('includeChecklistToggle').checked;
        const includeModules = $('moduleReplacementToggle').checked;

        let txt = `${month} ${dateObj.getDate()} | ${time}\nLine: ${line}\n\n`;

        const getIDs = (type) => {
            let block = "";
            selectedCutters.forEach(c => {
                block += c + "\n";
                [0, 1].forEach(i => {
                    // Blank or partial IDs are padded with "_" so the gap is visible in the chat.
                    const v = idInput(type, c, i).value.padEnd(4, "_");
                    block += `${FORMATS[c].prefix}${v}${FORMATS[c].suffixes[i]}\n`;
                });
            });
            return block;
        };

        if (selectedCutters.length > 0) {
            txt += `OLD Cutter IDs:\n\n${getIDs('old')}\n`;
            txt += `NEW Cutter IDs:\n\n${getIDs('new')}\n`;
        } else { txt += "No cutters replaced.\n\n"; }

        if (includeModules && selectedModules.length > 0) {
            txt += `${selectedModules.join(', ')} Module Replaced\n\n`;
            selectedModules.forEach(m => {
                const oldMod = $(`old-mod-${m}`).value || "N/A";
                const newMod = $(`new-mod-${m}`).value || "N/A";
                const reasonMod = $(`reason-mod-${m}`).value || "N/A";
                txt += `${m} Module:\nOLD Module ID: ${oldMod}\nNEW Module ID: ${newMod}\nReason for Replacement: ${reasonMod}\n\n`;
            });
        }

        // Unmarked checklist items are simply left out (some tasks are skipped on purpose).
        if (includeChecklist) {
            let marked = "";
            document.querySelectorAll('.check-input-toggle').forEach(toggle => {
                const state = toggle.dataset.state;
                if (state !== 'none') marked += `- ${toggle.dataset.taskDesc} : ${state === 'yes' ? 'Yes' : 'No'}\n`;
            });
            if (marked) txt += `Tasks Checklist:\n${marked}\n`;
        }

        if (remarks) txt += `Remarks:\n${remarks}\n`;

        currentReviewText = txt.trim();
        currentReviewLine = line;
        reviewMode = 'edit';

        currentIssues = collectIssues();
        markMissing(currentIssues);
        const n = currentIssues.length;

        $('review-title').textContent = 'Review Report';
        $('review-sub').textContent = n ? 'Missing details are highlighted in red.' : 'Check the report, then save and copy it.';
        $('review-issues').innerHTML = '';
        $('review-text').innerHTML = highlightReport(currentReviewText);
        $('review-buttons').innerHTML = `
            <button class="btn btn-secondary" style="flex:1;" onclick="handleBack()">Edit Form</button>
            <button class="btn" id="copyBtn" style="flex:2;" onclick="saveAndCopy()">Save & Copy</button>
        `;
        $('screen-review').querySelector('.scrollable-body').scrollTop = 0;
        showScreen('screen-review');
    }

    function viewReport(id) {
        const report = savedReports.find(r => r.id === id);
        if (!report) return;
        currentReviewText = report.text;
        reviewMode = 'view';
        currentIssues = [];
        $('review-title').textContent = LINES.includes(report.line) ? `Line ${report.line}` : 'Cutter Change';
        $('review-sub').textContent = `${dayLabel(report.date)}${report.time ? ' · ' + niceTime(report.time) : ''}`;
        $('review-issues').innerHTML = '';
        $('review-text').innerHTML = highlightReport(currentReviewText);
        $('review-buttons').innerHTML = `
            <button class="btn btn-icon btn-danger-soft" aria-label="Delete report" onclick="deleteReport(${Number(report.id)})">${ICONS.trash}</button>
            <button class="btn btn-secondary" style="flex:1;" onclick="editReport(${Number(report.id)})">Edit</button>
            <button class="btn" id="copyBtn" style="flex:1.4;" onclick="justCopy()">Copy Text</button>`;
        $('screen-review').querySelector('.scrollable-body').scrollTop = 0;
        showScreen('screen-review');
    }

    async function saveAndCopy() {
        if (currentIssues.length) {
            const n = currentIssues.length;
            const shown = currentIssues.slice(0, 4).map(x => `<li>${esc(x.msg)}</li>`).join('');
            const more = n > 4 ? `<li class="more">+ ${n - 4} more</li>` : '';
            const choice = await showSheet({
                title: `This report has ${n} gap${n > 1 ? 's' : ''}`,
                message: 'Missing IDs will show up as ____ or N/A in the group chat.',
                bodyHtml: `<ul class="sheet-list">${shown}${more}</ul>`,
                actions: [
                    { label: 'Go back and fix', value: 'fix', kind: 'primary' },
                    { label: 'Save & copy anyway', value: 'send', kind: 'danger' }
                ]
            });
            if (choice === 'fix') { goToIssue(0); return; }
            if (choice !== 'send') return;
        }

        const existing = savedReports.find(r => r.id === activeEditId);
        const stateToSave = {
            ...getFormState(),
            id: activeEditId || Date.now(),
            createdAt: existing?.createdAt || existing?.timestamp || Date.now(),
            timestamp: Date.now(),
            line: currentReviewLine,
            text: currentReviewText
        };

        const existingIdx = savedReports.findIndex(r => r.id === activeEditId);
        if (existingIdx >= 0) savedReports[existingIdx] = stateToSave;
        else savedReports.unshift(stateToSave);

        if (!persistReports()) return;
        clearDraft();
        formDirty = false;
        clearMissingMarks();
        const copied = await executeCopy();
        setTimeout(() => showScreen('screen-home'), copied ? 1200 : 0);
    }

    async function justCopy() { await executeCopy(); }

    function legacyCopy(text) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.cssText = 'position:fixed; top:0; left:0; opacity:0;';
        document.body.appendChild(ta);
        ta.select();
        ta.setSelectionRange(0, text.length);
        let ok = false;
        try { ok = document.execCommand('copy'); } catch (e) {}
        ta.remove();
        return ok;
    }

    async function executeCopy() {
        let ok = false;
        try { await navigator.clipboard.writeText(currentReviewText); ok = true; }
        catch (e) { ok = legacyCopy(currentReviewText); }

        if (!ok) {
            showToast("Couldn't copy the text", {
                sub: reviewMode === 'edit' ? 'The report is saved. Open it from Recent changes and tap Copy.' : 'Check the browser permissions and try again.',
                type: 'error', ms: 4000
            });
            return false;
        }
        buzz([15, 50, 15]);
        const btn = $("copyBtn");
        if (btn) {
            btn.innerText = "✓ Copied!";
            btn.classList.add("copy-success");
            setTimeout(() => {
                btn.innerText = reviewMode === 'edit' ? "Save & Copy" : "Copy Text";
                btn.classList.remove("copy-success");
            }, 2000);
        }
        return true;
    }

    init();
</script>

<script>
(function () {
    const SNOOZE_KEY = 'cid_install_snooze_until';
    const INSTALLED_KEY = 'cid_installed';
    const SNOOZE_DAYS = 7;

    function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
    function read(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

    const isStandalone = window.navigator.standalone === true ||
        (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
    if (isStandalone) { store(INSTALLED_KEY, '1'); return; }       // already running as the app
    if (read(INSTALLED_KEY) === '1') return;
    if (Date.now() < parseInt(read(SNOOZE_KEY) || '0', 10)) return; // user tapped "Not now" recently

    const ua = navigator.userAgent;
    const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    let deferredPrompt = null;

    const shareIcon = '<svg class="cid-install-share" viewBox="0 0 24 24" fill="none" stroke="#007AFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M8 7l4-4 4 4"/><path d="M5 11v8a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-8"/></svg>';

    function show(mode) {
        if (document.querySelector('.cid-install-backdrop')) return;
        const el = document.createElement('div');
        el.className = 'cid-install-backdrop';
        const body = mode === 'ios'
            ? `<div class="cid-install-steps"><ol>
                   <li>Tap the Share button ${shareIcon} in Safari's toolbar</li>
                   <li>Scroll down and tap <b>Add to Home Screen</b></li>
                   <li>Tap <b>Add</b></li>
               </ol></div>
               <button class="cid-install-btn cid-install-primary" data-act="ok">Got it</button>`
            : `<button class="cid-install-btn cid-install-primary" data-act="install">Install App</button>`;
        el.innerHTML = `
            <div class="cid-install-sheet" role="dialog" aria-label="Install Cutter ID">
                <div class="cid-install-head">
                    <img src="CID-icon-180.png" alt="">
                    <div><h3>Install Cutter ID</h3><p>Open it from your home screen, full-screen, like a regular app.</p></div>
                </div>
                ${body}
                <button class="cid-install-btn cid-install-later" data-act="later">Not now</button>
            </div>`;
        document.body.appendChild(el);
        requestAnimationFrame(() => el.classList.add('show'));

        function close() { el.classList.remove('show'); setTimeout(() => el.remove(), 300); }
        function snooze() { store(SNOOZE_KEY, String(Date.now() + SNOOZE_DAYS * 864e5)); }

        el.addEventListener('click', async (e) => {
            const act = e.target.closest('[data-act]')?.dataset.act;
            if (e.target === el || act === 'later' || act === 'ok') { snooze(); close(); return; }
            if (act === 'install' && deferredPrompt) {
                deferredPrompt.prompt();
                const choice = await deferredPrompt.userChoice.catch(() => null);
                if (choice && choice.outcome === 'accepted') store(INSTALLED_KEY, '1'); else snooze();
                deferredPrompt = null;
                close();
            }
        });
    }

    // Android / desktop Chrome & Edge: the browser tells us when installing is possible
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        setTimeout(() => show('prompt'), 1200);
    });
    window.addEventListener('appinstalled', () => store(INSTALLED_KEY, '1'));

    // iOS has no install API, so show the Add to Home Screen steps instead
    if (isIOS) window.addEventListener('load', () => setTimeout(() => show('ios'), 1200));
})();
</script>
</body>
</html>
